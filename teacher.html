<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사 모드 - 3학년 보건간호과 국시대비반</title>
<style>
:root{
  --deep: #0f4c3a;
  --deep2: #0a3428;
  --mint: #e9f7f0;
  --mint-box: #eafaf3;
  --peach-box: #fdf3e3;
  --lav-box: #f1eefb;
  --accent: #14805f;
  --accent-dark: #0d5e45;
  --yellow-bg: #fdf6de;
  --yellow-border: #f0d878;
  --ink: #1c2b26;
  --sub: #667f76;
  --border: #dcece4;
  --pass: #1a9d63;
  --fail: #e0334f;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(10,52,40,0.18);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background: linear-gradient(165deg,#1a7a5c 0%, var(--deep2) 100%);
  color:var(--ink);
  min-height:100vh;
  word-break:keep-all;
  line-height:1.5;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:32px 16px 60px;
  overflow-x:hidden;
}

.topbar{
  color:#fff;
  padding:6px 4px 22px;
}
.topbar h1{
  margin:0;
  font-size:20px;
}
.topbar .sub{
  margin-top:6px;
  font-size:13px;
  opacity:0.85;
}
.topbar a.btn.ghost{
  color:#fff;border-color:rgba(255,255,255,.5);
}

/* Hero card (start screens) */
.hero-card{
  background:#fff;
  border-radius:24px;
  box-shadow: var(--shadow);
  padding:36px 28px 30px;
  text-align:center;
}
.hero-icon{ font-size:38px; margin-bottom:10px; }
.hero-card h1{
  margin:4px 0 2px;
  font-size:20px;
  color:var(--accent-dark);
  font-weight:800;
}
.hero-card .hero-sub{ font-size:14px; color:var(--ink); font-weight:600; margin-bottom:4px; }
.hero-card .hero-meta{ font-size:12.5px; color:var(--sub); margin-bottom:20px; }

.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.stat-box{ border-radius:14px; padding:14px 6px; text-align:center; }
.stat-box:nth-child(1){ background:var(--mint-box); }
.stat-box:nth-child(2){ background:var(--peach-box); }
.stat-box:nth-child(3){ background:var(--mint-box); }
.stat-box .num{ font-size:19px; font-weight:800; color:var(--accent-dark); }
.stat-box .label{ font-size:11.5px; color:var(--sub); margin-top:2px; }

.callout{
  background:var(--yellow-bg);
  border:1.5px solid var(--yellow-border);
  border-radius:12px;
  padding:12px 14px;
  font-size:12.5px;
  color:#7a5c12;
  margin-bottom:20px;
  line-height:1.7;
}
.callout b{ color:#5c4200; }

.field-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }

/* generic card for non-hero screens */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding:22px;
  margin-bottom:16px;
}
.card h2{
  margin-top:0;
  font-size:16px;
  color:var(--accent-dark);
  border-bottom:2px solid var(--mint);
  padding-bottom:8px;
  margin-bottom:14px;
  font-weight:800;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background: var(--deep);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:15px 20px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition: opacity .12s ease, transform .12s ease;
  text-decoration:none;
}
.btn:hover{ opacity:.92; }
.btn:active{ transform: translateY(1px); }
.btn.secondary{ background:#fff; color:var(--accent-dark); border:1.5px solid var(--accent); }
.btn.ghost{ background:transparent; border:1.5px solid var(--border); color:var(--accent-dark); }
.btn.wide{ width:100%; }
.btn:disabled{ background:#c9d8d1; color:#fff; cursor:not-allowed; opacity:1; }

select, input[type=text]{
  width:100%;
  padding:14px 14px;
  border-radius:12px;
  border:1.5px solid var(--border);
  font-size:14.5px;
  background:#fbfdfc;
  color:var(--ink);
  appearance:none;
}
select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

.grid{ display:grid; gap:12px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
@media (max-width:600px){
  .grid.cols-2, .grid.cols-3{ grid-template-columns:1fr; }
}

.confirm-box{
  background: var(--mint-box);
  border:1.5px solid var(--accent);
  border-radius:12px;
  padding:12px 14px;
  font-size:13.5px;
  font-weight:700;
  color:var(--accent-dark);
  margin-top:2px;
}

.tag{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.tag.pass{ background:#e1f6ea; color:var(--pass); }
.tag.fail{ background:#fbe1e5; color:var(--fail); }

table{ width:100%; border-collapse:collapse; font-size:13.5px; background:#fff;}
th,td{ padding:10px 8px; text-align:center; border-bottom:1px solid var(--border); }
th{ background: var(--mint); color:var(--accent-dark); font-weight:700; position:sticky; top:0; }
tr.row-fail td{ background:#fff3f4; }
tr:hover td{ background:#fafdfb; }

.qgrid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; min-width:0; }
@media (max-width:560px){ .qgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.qitem{ border:1.5px solid var(--border); border-radius:10px; padding:6px 2px; text-align:center; background:#fff; min-width:0; overflow:hidden; }
.qitem .qnum{ font-size:11px; color:var(--sub); }
.qitem .opts{ display:flex; justify-content:center; gap:1px; margin-top:4px; flex-wrap:wrap; }
.qitem button{ width:18px;height:18px; border-radius:50%; border:1.5px solid var(--border); background:#fff; font-size:9.5px; cursor:pointer; padding:0; flex-shrink:0; }
.qitem button.sel{ background:var(--accent); color:#fff; border-color:var(--accent); }
.qitem.unanswered{ border-color:var(--fail); }
.qitem.wrong{ background:#fdecec; border-color:var(--fail); }
.qitem.correct{ background:#eafaf1; border-color:var(--pass); }

.timer{ font-variant-numeric: tabular-nums; font-weight:800; font-size:19px; color:var(--accent-dark); background:var(--mint-box); padding:6px 12px; border-radius:10px; }
.timer.warn{ color:#fff; background:var(--fail); }

.progressbar{ height:8px; border-radius:6px; background:var(--mint); overflow:hidden; margin:10px 0; }
.progressbar > div{ height:100%; background:var(--accent); }

.center{ text-align:center; }
.muted{ color:var(--sub); font-size:13px; }
.big-num{ font-size:40px; font-weight:800; color:var(--accent-dark); }

.nav-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.nav-tabs button{
  padding:10px 16px; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff;
  font-weight:700; cursor:pointer; font-size:13.5px; border-radius:10px;
}
.nav-tabs button.active{ background:#fff; color:var(--accent-dark); border-color:#fff; }

.loading{ text-align:center; padding:40px; color:#fff; }

.print-btn{
  position:fixed; bottom:20px; right:20px;
  background:var(--deep); color:#fff; border:none; border-radius:24px;
  padding:12px 18px; font-weight:700; font-size:13.5px; cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:50;
}
@media print{
  .no-print{ display:none !important; }
  body{ background:#fff !important; }
  .nav-tabs, #explainRoundSelect, #loadingBox { display:none !important; }
  .card{ box-shadow:none !important; border:1px solid #ccc !important; }
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
/* CDN이 차단된 환경(학교망 등)을 대비해 보조 CDN을 한 번 더 시도한다.
   둘 다 실패해도 아래 자체 그래프로 대체되므로 화면은 정상 동작한다. */
if(typeof Chart === 'undefined'){
  document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/scr'+'ipt>');
}
</script>
</head>
<body>
<div class="topbar">
  <div class="wrap" style="padding:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <div>
      <h1>🏥 교사 모드</h1>
      <div class="sub">3학년 보건간호과 국시대비반 관리 대시보드</div>
    </div>
    <a href="index.html" class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4);">처음으로</a>
  </div>
</div>

<!-- 비밀번호 잠금 화면 -->
<div class="wrap" id="lockScreen">
  <div class="card" style="max-width:420px;margin:40px auto;text-align:center;">
    <div style="font-size:40px;margin-bottom:8px;">🔒</div>
    <h2 style="border:none;">교사 모드 로그인</h2>
    <p class="muted">비밀번호를 입력하세요.</p>
    <input type="password" id="pwInput" placeholder="비밀번호"
           style="width:100%;padding:12px 14px;margin-top:14px;border:1.5px solid #cfe0d8;border-radius:10px;font-size:15px;text-align:center;letter-spacing:4px;">
    <div id="pwError" style="display:none;color:var(--fail);font-size:13px;margin-top:10px;">비밀번호가 올바르지 않습니다.</div>
    <button class="btn wide" id="pwBtn" style="margin-top:14px;">들어가기</button>
  </div>
</div>

<div class="wrap" id="mainScreen" style="display:none;">
  <!-- 반 선택 -->
  <div class="card no-print" style="padding:16px 18px;">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <label class="muted" style="margin:0;font-weight:700;">반 선택</label>
      <select id="classSelect" style="max-width:220px;margin:0;"></select>
      <span class="muted" id="classInfo" style="margin-left:auto;"></span>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="passfail">회차별 Pass/Fail</button>
    <button class="tab-btn" data-tab="trend">학생별 추이</button>
    <button class="tab-btn" data-tab="explain">회차별 해설</button>
    <button class="tab-btn" data-tab="topwrong">회차별 최다오답 TOP20</button>
  </div>

  <div id="loadingBox" class="card loading">데이터를 불러오는 중입니다...</div>

  <!-- TAB 1: Pass/Fail -->
  <div class="tab-panel" id="panel-passfail" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h2 style="border:none;margin:0;padding:0;">✅ 회차별 Pass / Fail 명단</h2>
        <button class="btn secondary no-print" onclick="window.print()" style="padding:8px 14px;font-size:13px;">🖨️ 인쇄 / PDF 저장</button>
      </div>
      <p class="muted" style="margin-top:10px;">합격 = 총점 <b id="pfThresholdLabel"></b> 이상 <b>그리고</b> 전 과목 40% 이상(과락 없음)</p>
      <label class="muted">회차 선택</label>
      <select id="pfRoundSelect"></select>
      <div style="margin-top:16px;overflow-x:auto;">
        <table id="pfTable">
          <thead><tr><th>이름</th><th>정답수</th><th>점수</th><th>과락 과목</th><th>결과</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="muted" id="pfEmpty" style="display:none;">해당 회차에 아직 응시 기록이 없습니다.</p>
    </div>
  </div>

  <!-- TAB 2: 학생별 추이 -->
  <div class="tab-panel" id="panel-trend" style="display:none;">
    <div class="card">
      <h2>📈 학생별 점수 추이 (<span id="trendCount">-</span>명 전체)</h2>
      <p class="muted" id="allTrendNote" style="display:none;"></p>
      <canvas id="allTrendChart" height="110"></canvas>
    </div>
    <div class="card">
      <h2>👤 개별 학생 추이</h2>
      <select id="studentTrendSelect"></select>
      <canvas id="singleTrendChart" height="100" style="margin-top:12px;"></canvas>
    </div>
  </div>

  <!-- TAB 3: 회차별 해설 -->
  <div class="tab-panel" id="panel-explain" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h2 style="border:none;margin:0;padding:0;">📖 회차별 전체 문항 해설</h2>
        <button class="btn secondary no-print" onclick="window.print()" style="padding:8px 14px;font-size:13px;">🖨️ 인쇄 / PDF 저장</button>
      </div>
      <select id="explainRoundSelect" style="margin-top:12px;"></select>
      <div id="explainList" style="margin-top:16px;"></div>
    </div>
  </div>

  <!-- TAB 4: 회차별 최다오답 TOP20 -->
  <div class="tab-panel" id="panel-topwrong" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h2 style="border:none;margin:0;padding:0;">🔥 회차별 최다오답 TOP 20</h2>
        <button class="btn secondary no-print" onclick="window.print()" style="padding:8px 14px;font-size:13px;">🖨️ 인쇄 / PDF 저장</button>
      </div>
      <p class="muted">선택한 <b>반</b>의 <b>해당 회차</b>에서 가장 많이 틀린 20문항입니다.</p>
      <label class="muted">회차 선택</label>
      <select id="twRoundSelect"></select>
      <div id="topWrongList" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

/* ---------- 교사 모드 비밀번호 ---------- */
const TEACHER_PASSWORD = "1590";

/* ---------- 시험 구성 ---------- */
const TOTAL_ROUNDS = 17;
const QUESTIONS_PER_ROUND = 105;
const TIME_LIMIT_MINUTES = 100;

/* 총점 합격 기준 (실제 국가시험은 60%. 교내 기준을 바꾸려면 이 값만 수정) */
const PASS_THRESHOLD = 0.7;

/* 과목별 과락 기준 (실제 국가시험 기준: 과목별 40% 미만이면 과락) */
const SUBJECT_MIN_RATIO = 0.4;

/* 간호조무사 국가시험 105문항 과목 구성 */
const SUBJECTS = [
  { key:"basic",     name:"기초간호학개요", from:1,  to:35 },
  { key:"pubnurse",  name:"보건간호학개요", from:36, to:50 },
  { key:"pubhealth", name:"공중보건학개론", from:51, to:70 },
  { key:"practice",  name:"실기",           from:71, to:105 }
];

/* ---------- 채점 ---------- */
function gradeExam(round, answers){
  const key = ANSWER_KEY[round];
  let correct = 0;
  const wrongQuestions = [];
  for(let q=1;q<=QUESTIONS_PER_ROUND;q++){
    if(answers[q] === key[q-1]) correct++;
    else wrongQuestions.push(q);
  }

  const subjects = SUBJECTS.map(s=>{
    const total = s.to - s.from + 1;
    let c = 0;
    for(let q=s.from;q<=s.to;q++){ if(answers[q] === key[q-1]) c++; }
    const ratio = c/total;
    return {
      key: s.key, name: s.name,
      correct: c, total: total,
      ratio: ratio,
      pct: Math.round(ratio*1000)/10,
      cut: Math.ceil(total*SUBJECT_MIN_RATIO),   // 과락을 면하는 최소 정답 수
      fail: ratio < SUBJECT_MIN_RATIO
    };
  });

  const failedSubjects = subjects.filter(s=>s.fail);
  const totalRatio = correct/QUESTIONS_PER_ROUND;
  const totalPass  = totalRatio >= PASS_THRESHOLD;

  return {
    correct: correct,
    score: Math.round(totalRatio*1000)/10,
    totalRatio: totalRatio,
    totalPass: totalPass,                       // 총점 기준 통과 여부
    subjects: subjects,
    failedSubjects: failedSubjects,
    hasSubjectFail: failedSubjects.length > 0,
    pass: totalPass && failedSubjects.length === 0,  // 최종 합격 = 총점 + 과락 없음
    wrongQuestions: wrongQuestions
  };
}

/* ---------- 학생별 결과 멘트 ---------- */
function buildComment(result, name){
  const s = result.score;
  const nm = name || "학생";
  const weakest = result.subjects.slice().sort((a,b)=>a.ratio-b.ratio)[0];
  const best    = result.subjects.slice().sort((a,b)=>b.ratio-a.ratio)[0];
  const failNames = result.failedSubjects.map(x=>x.name).join(", ");

  let title, body, mood;

  // 1) 과락으로 인한 불합격 (총점은 넘었는데 특정 과목이 40% 미만)
  if(result.totalPass && result.hasSubjectFail){
    mood = "warn";
    title = "총점은 합격선인데, 과락이 발목을 잡았어요";
    body = nm+"님, 총점 "+s+"점은 충분히 합격선을 넘겼어요. 그런데 <b>"+failNames+
           "</b> 과목이 40% 미만이라 실제 시험이었다면 불합격 처리됩니다. "+
           "국가시험은 총점만으로 합격하지 않아요. 지금부터는 전체를 넓게 보기보다 "+
           "<b>"+failNames+"</b>만 집중해서 끌어올리면 바로 합격권입니다. 이번 회차 오답부터 다시 풀어보세요.";
  }
  // 2) 총점도 미달 + 과락도 있음
  else if(!result.totalPass && result.hasSubjectFail){
    if(s >= 55){
      mood = "warn";
      title = "합격선이 눈앞이에요. 취약 과목부터 잡아봐요";
      body = nm+"님, "+s+"점이면 합격선까지 얼마 남지 않았어요. 다만 <b>"+failNames+
             "</b> 과목이 과락이라 이곳을 먼저 손봐야 합니다. 가장 약한 "+weakest.name+
             " 과목은 "+weakest.total+"문항 중 "+weakest.correct+"문항 정답이었어요. "+
             "여기서 "+Math.max(0, weakest.cut-weakest.correct)+"문항만 더 맞히면 과락은 벗어납니다. 충분히 가능한 숫자예요.";
    } else {
      mood = "bad";
      title = "기초부터 차근차근 다시 쌓아봐요";
      body = nm+"님, 이번 회차는 "+s+"점이었어요. 아직 전 과목이 고르게 부족한 단계라 "+
             "문제풀이보다 개념 정리가 먼저 필요해요. 특히 <b>"+weakest.name+
             "</b> 과목이 가장 약하니 이 단원 이론부터 다시 읽고 오답노트를 만들어보세요. "+
             "지금 점수는 출발점일 뿐이고, 반복하면 반드시 오릅니다.";
    }
  }
  // 3) 과락은 없는데 총점 미달
  else if(!result.totalPass){
    if(s >= 60){
      mood = "warn";
      title = "과락 없이 안정적이에요. 총점만 조금 더!";
      body = nm+"님, 과목별로 무너진 곳 없이 고르게 풀었다는 점이 아주 좋아요. "+
             "총점 "+s+"점으로 합격선까지 조금 남았습니다. "+
             "가장 낮은 "+weakest.name+" 과목에서 몇 문항만 더 잡으면 바로 통과예요. "+
             "이번 오답 문항만 정확히 복습해도 다음 회차엔 넘어갈 수 있어요.";
    } else {
      mood = "warn";
      title = "과락은 면했어요. 이제 전체 점수를 올릴 차례";
      body = nm+"님, 과락 과목이 없다는 건 기본기는 잡혀 있다는 뜻이에요. "+
             "총점 "+s+"점에서 올리려면 문항 수가 많은 기초간호학개요와 실기(각 35문항)에서 "+
             "점수를 만드는 게 가장 효율적입니다. 지금은 "+weakest.name+" 과목이 가장 약하니 여기부터 시작해보세요.";
    }
  }
  // 4) 합격
  else {
    if(s >= 90){
      mood = "great";
      title = "최상위권이에요. 이 페이스를 유지하세요";
      body = nm+"님, "+s+"점은 아주 훌륭한 성적이에요. 과락도 없고 전 과목이 안정적입니다. "+
             "이제는 새로운 문제를 늘리기보다, 틀린 문항의 <b>오답 선지까지</b> 왜 틀렸는지 설명할 수 있는지 "+
             "점검해보세요. 실전에서 흔들리지 않는 힘이 거기서 나옵니다.";
    } else if(s >= 80){
      mood = "great";
      title = "안정적인 합격권이에요";
      body = nm+"님, "+s+"점으로 여유 있게 합격권입니다. "+best.name+" 과목은 특히 잘하고 있어요. "+
             "다만 "+weakest.name+" 과목이 상대적으로 낮으니 여기만 보완하면 90점대도 가능해요. "+
             "실수로 틀린 문항과 몰라서 틀린 문항을 구분해 정리해보세요.";
    } else {
      mood = "ok";
      title = "합격이에요! 다만 아직 여유는 부족해요";
      body = nm+"님, "+s+"점으로 합격 기준은 넘겼어요. 축하합니다. "+
             "다만 실전에서는 컨디션에 따라 몇 문항은 흔들릴 수 있으니 조금 더 여유를 만들어두면 좋아요. "+
             "가장 낮은 "+weakest.name+" 과목을 집중 보완해서 안정권으로 올려봅시다.";
    }
  }

  return { title: title, body: body, mood: mood };
}

/* ---------- 과목 요약 HTML (결과 화면 / 교사 화면 공용) ---------- */
function subjectTableHTML(result){
  let html = '<table class="subj-table"><thead><tr>'
           + '<th style="text-align:left;">과목</th><th>정답</th><th>득점률</th><th>과락기준</th><th>판정</th>'
           + '</tr></thead><tbody>';
  result.subjects.forEach(s=>{
    html += '<tr class="'+(s.fail?'subj-fail':'')+'">'
          + '<td style="text-align:left;">'+s.name+'</td>'
          + '<td>'+s.correct+' / '+s.total+'</td>'
          + '<td>'+s.pct+'%</td>'
          + '<td>'+s.cut+'문항 이상</td>'
          + '<td>'+(s.fail?'<span class="tag fail">과락</span>':'<span class="tag pass">통과</span>')+'</td>'
          + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

    10:"정답 ① 비타민 A 결핍 시 야맹증이 나타난다. 오답: ②비타민D 결핍은 구루병(괴혈병 아님) ③비타민K 결핍은 출혈경향(악성빈혈은 B12 결핍) ④아스코브산(C) 결핍은 괴혈병(각기병은 B1) ⑤싸이아민(B1) 결핍은 각기병(구각염은 B2).",
    11:"정답 ② 치수는 치아 중심부에 위치하며 신경과 혈관이 있다. 오답: ①사기질(법랑질)은 치아 표면의 단단한 층으로 신경이 없음 ③이뿌리는 구조상 명칭일 뿐 신경혈관 중심이 아님 ④잇몸(치은)은 신경혈관 중심부가 아님 ⑤시멘트질은 뿌리 표면층.",

    14:"정답 ⑤ 침을 돌리거나 뺄 수 없는 상태는 체침이다. 오답: ①②③④(호침·화침·발침·만침)는 각각 다른 침 관련 용어로 '빠지지도 돌아가지도 않는' 증상과 일치하지 않음.",
    15:"정답 ④ 노화로 인해 노인성 반점(갈색반점)이 생긴다. 오답: ①손발톱은 오히려 두꺼워지고 잘 부서짐(얇아지는 것 아님) ②피하지방은 감소하나 땀 분비도 함께 감소(많아지지 않음) ③피부는 얇아지고 건조해짐(두꺼워지지 않음) ⑤기름샘(피지샘) 분비는 감소함.",
    16:"정답 ④ 대변검사(잠혈검사)로 위장관 출혈 여부를 확인할 수 있다. 오답: ①CBC는 전반적 혈액검사로 출혈 부위를 특정하지 못함 ②가래검사는 호흡기 관련 ③소변검사는 비뇨기 관련 ⑤복부초음파는 영상검사로 잠혈 확인의 1차 방법이 아님.",
    17:"정답 ④ 악성종양은 전이가 잘 되는 특징이 있다. 오답: ①악성종양은 피막이 없음 ②악성종양은 분화가 나쁨(미분화) ③악성종양은 성장속도가 빠름 ⑤악성종양은 예후가 나쁨.",
    18:"정답 ① 골관절염 환자에게는 관절 부담이 적은 수영이 권장된다. 오답: ②③④(조깅·계단걷기·달리기)는 관절에 충격을 주는 고강도 운동으로 부적절 ⑤탁구도 관절 부담과 순발력이 필요해 상대적으로 부적합.",
    19:"정답 ③ 위절제 후에는 단백질 섭취를 권장한다. 오답: ①탄수화물(특히 단순당)은 덤핑증후군을 유발할 수 있어 제한 필요 ②지방을 철저히 제한할 필요는 없음(적정 섭취) ④식사 중 수분 섭취는 제한(식후 일정 시간 뒤 섭취) ⑤식후에는 눕는 자세가 덤핑증후군 예방에 도움.",
    20:"정답 ① 전염(A형)간염은 오염된 물이나 음식으로 감염된다. 오답: ②A형간염은 대부분 회복되며 만성화가 드묾(B형·C형이 만성화 잘 됨) ③수직감염은 B형간염에서 더 흔함 ④일반 장갑으로도 충분, 멸균장갑까지는 불필요 ⑤고지방 식이는 오히려 부담, 저지방 식이가 권장됨.",

    30:"정답 ③ 노인은 숙면이 어려운 것이 수면 특징이다. 오답: ①노인은 낮잠이 오히려 늘어남 ②잠자리에 든 뒤 잠들기까지 시간이 오래 걸림(빨리 잠드는 것 아님) ④⑤REM수면(꿈꾸는 수면)은 감소함(늘어나거나 증가하는 것 아님).",

    34:"정답 ④ 코피가 날 때 콧등이나 목덜미에 얼음주머니를 대준다. 오답: ①고개는 앞으로 숙여야 함(뒤로 젖히면 피가 기도로 넘어감) ②입안에 고인 피는 삼키지 말고 뱉어내야 함 ③코가 아닌 입으로 호흡해야 함(코를 막고) ⑤감염 증상 관찰은 응급처치가 아님.",
    35:"정답 ⑤ 9의 법칙: 양팔(9%×2)+양다리(18%×2)=54%. 오답: ①②③④는 계산 과정에서 부위별 비율을 잘못 적용한 값.",
    36:"정답 ② 보건교육은 지역사회 간호업무 중 가장 기본적이고 포괄적이다. 오답: ①지식 전달만이 목표가 아니라 행동변화까지 포함 ③대상자는 개인·가족에 한정되지 않고 지역사회 전체 ④⑤교육자의 흥미·기술보다 대상자의 요구와 이해가 우선.",

    38:"정답 ③ 시범교육이 칫솔질 교육에 가장 적합하다. 오답: ①②④⑤(강의·전단지·비디오·OHP)는 일방적 전달 방식으로 실기 기술 습득에는 직접 시범이 더 효과적.",
    39:"정답 ② 63점 이상 합격 기준은 절대평가에 해당한다. 오답: ①진단평가는 사전 수준 파악 목적 ③상대평가는 상대적 순위를 기준으로 함(고정 점수 기준 아님) ④형성평가는 수업 과정 중 평가 ⑤결과평가는 사후 전체 평가.",
    40:"정답 ⑤ 갈등을 중재하는 관리 단계는 조정이다. 오답: ①기획, ②조직, ③인사, ④지휘는 각각 다른 관리 기능으로 갈등 중재와 직접 관련이 적음.",

    42:"정답 ② 보건소장은 시장·군수·구청장이 임명한다. 오답: ①보건소는 시·군·구 단위에 설치(읍·면은 보건지소) ③지역보건법에 따라 운영(보건소법이라는 명칭 아님) ④⑤보건소는 보건복지부 관할이며 행정안전부의 기술지원을 받지 않음.",
    43:"정답 ① WHO는 국제 보건사업의 지휘 및 조정이 주요 업무이다. 오답: ②실제로는 6개 지역사무소가 있음 ③우리나라는 서태평양 지역사무소 소속(동남아시아 아님) ④WHO 본부는 스위스 제네바(필리핀 마닐라 아님) ⑤인류의 영양기준·생활수준 향상은 FAO 등 타 기구의 목적과 혼동됨.",

    77:"정답 ② 복부검진은 시진→청진→타진→촉진 순으로 진행한다. 오답: ①검사 전 배뇨를 하여 방광을 비우는 것이 권장됨 ③앙와위(누운 자세)가 기본 검진 자세 ④검진자의 손은 따뜻하게 하여 근육긴장을 예방해야 함 ⑤통증이 심한 부위는 가장 마지막에 촉진.",
    78:"정답 ② 사용한 주삿바늘은 다른 주사기로 약물을 옮기지 않는다(교차오염 방지). 오답: ①일회용 주사기는 자제가 아니라 오히려 사용이 권장됨 ③사용한 주삿바늘은 뚜껑을 씌우지 않고(재캡핑 금지) 바로 폐기 ④주삿바늘은 손상성폐기물 용기(붉은색)에 폐기(일반의료폐기물 아님) ⑤바이알에 바늘을 꽂아두면 오염 위험이 있어 금기.",
    79:"【그림 선지 문항】 정답은 ③번 그림입니다. 지팡이 길이는 세 가지 기준으로 판단합니다: ⓐ 바로 선 자세에서 손잡이가 넙다리뼈 큰돌기(대전자) 높이에 온다, ⓑ 지팡이를 짚었을 때 팔꿈치가 약 30도 구부러진다, ⓒ 지팡이 끝이 발 앞·바깥쪽 약 15cm 지점에 놓인다. ③번은 상체를 바로 세운 채 팔꿈치가 자연스럽게 약간 굽어 있고 지팡이가 발 옆에 수직으로 놓여 세 조건을 모두 만족합니다. 오답: ①번은 팔꿈치를 편 채 지팡이 끝을 발에서 멀리 앞쪽에 짚어 지지 기반이 불안정하고, ②번은 지팡이 길이가 맞지 않아 상체를 앞으로 굽힌 자세가 되어 허리에 부담이 가며, ④번은 팔꿈치가 지나치게 굽고 어깨가 들려 있어 지팡이가 너무 긴 경우이고, ⑤번은 지팡이를 몸에서 멀리 옆으로 벌려 짚어 무게중심이 지지면을 벗어나 있습니다. 지팡이는 마비된 쪽이 아니라 건강한 쪽 손에 쥐고, 지팡이→약한 다리→건강한 다리 순으로 이동합니다.",
    80:"정답 ② 병원성 미생물을 사멸시키지만 세균의 아포는 사멸시키지 못하는 것을 소독이라 한다. 오답: ①멸균은 아포까지 완전히 사멸시킴 ③방부는 미생물의 증식을 억제하는 것 ④무균은 균이 없는 상태 자체를 의미 ⑤감염은 균이 침입해 증식하는 상태.",
    81:"정답 ③ 가압증기멸균 시 겸자는 끝을 벌리고 날카로운 기구는 거즈로 감싼다. 오답: ①가압증기멸균은 보통 121℃ 내외에서 시행(120℃ 50~60분은 정확한 표준수치와 다소 차이) ②플라스틱·고무는 열에 약해 가압증기멸균에 부적합(EO가스멸균이 적합) ④기구는 증기 순환을 위해 눕혀서 넣는 것이 일반적 ⑤유효기간 등 표시는 소독포 바깥쪽에 기재.",
    82:"정답 ⑤ 기초 대사율 측정은 금식이 필요한 검사이다. 오답: ①골밀도검사, ②유방촬영, ③심전도는 금식이 필요하지 않은 비침습 검사 ④복수천자는 반드시 금식이 필요하지는 않음.",
    83:"정답 ③ 유치도관을 가지고 있는 환자는 검체 채취 포트를 소독제로 닦아낸 후 멸균주사기로 채취한다. 오답: ①검사가 지연될 때는 냉장 보관해야 함(실온 보관 아님) ②일반 소변검사는 인공도뇨 없이 중간뇨로 채취 가능 ④소변을 흘렸을 경우 해당 시간을 다시 측정해야 함 ⑤24시간 소변검사는 첫 소변은 버리고 마지막 소변을 포함시켜야 함.",
    84:"정답 ② 눈은 안쪽(눈 안쪽 구석)에서 바깥쪽으로 닦아 분비물이 눈물길로 역류하거나 반대편 눈으로 옮는 것을 막는다. 오답: ①침상목욕은 눈·얼굴에서 시작해 팔·가슴·복부·다리·등·회음부 순으로 진행하므로 제시된 순서와 다름 ③간호조무사로부터 먼 쪽 팔을 먼저 닦고 가까운 쪽을 나중에 닦음 ④상지는 어깨가 아니라 말단(손)에서 어깨 방향으로 닦아 정맥순환을 돕는다 ⑤복부는 위에서 아래가 아니라 대장의 연동방향인 시계방향으로 마사지하듯 닦는다.",
    85:"정답 ④ 무의식 환자는 틀니가 기도로 넘어갈 위험이 있으므로 반드시 제거하여 보관한다. 오답: ①과산화수소수는 틀니를 변색·손상시킬 수 있어 전용 세정제나 일반 칫솔질이 적절 ②틀니는 아랫니가 아니라 윗니부터 제거 ③싱크대에 물을 받아두는 것은 낙하 시 파손을 막기 위한 보조 조치일 뿐, 물에 담근 채 닦는 방식이 표준 절차는 아님 ⑤뜨거운 물은 틀니를 변형시키므로 찬물이나 미온수에 보관한다.",
    86:"정답 ③ 인공항문 간호 시 무·양파 등 가스형성 음식은 피하도록 한다. 오답: ①인공항문 색깔이 적갈색·보라색이면 혈액순환장애가 의심되는 비정상 소견 ②수분 섭취는 오히려 충분히 해야 함 ④인공항문 세척을 위해 매달 병원에 방문할 필요는 없음(교육 후 자가관리) ⑤인공항문 주변이 살짝 돌출되고 습기가 있는 것은 정상 소견에 가까움(과도한 돌출·건조 등 이상 시 보고).",
    87:"정답 ② 핍뇨는 시간당 30cc 이하일 때를 말한다. 오답: ①정상뇨는 1일 1~2L 수준(3.5L는 다뇨에 가까움) ③다뇨는 1일 2.5~3L 이상 ④무뇨는 1일 100cc 이하(500cc 아님) ⑤잔뇨는 50~100cc 이상일 때 비정상으로 봄(10cc는 정상 범위).",
    88:"【그림 선지 문항】 정답은 ①번 그림입니다. 물약을 따르는 올바른 방법은 세 가지 조건을 동시에 만족해야 합니다: ⓐ 라벨이 손바닥 쪽으로 오도록 병을 잡아 약물이 흘러내려도 라벨이 지워지거나 오염되지 않게 한다, ⓑ 약컵을 눈높이까지 들어 올려 시선과 수평이 되게 한다, ⓒ 액체 표면 가운데(메니스커스)의 아래쪽 선을 눈금에 맞춰 계량한다. 오답: ⑤번은 약컵을 책상에 놓은 채 위에서 내려다보며 따르는 그림으로, 시선 각도 때문에 실제보다 적게 담기게 되어 정확한 계량이 되지 않는다. ②③④번은 약컵을 든 높이가 눈높이에서 벗어났거나 라벨이 따르는 쪽을 향하고 있어 위 조건을 모두 만족하지 못한다.",
    89:"정답 ③ 유치도뇨 준비 시 10cc 멸균주사기가 필요하다(풍선 고정용 증류수 주입). 오답: ①삽입 시에는 멸균장갑이 필요(일회용 장갑만으로는 부족) ②멸균 생리식염수는 세척 등에 쓰이나 필수 준비물은 아님 ④단순도관이 아닌 풍선이 달린 유치도관이 필요 ⑤멸균가운까지는 필요하지 않음(멸균장갑으로 충분).",
    90:"정답 ② 코위관(레빈튜브) 삽입 길이는 코에서 귓불까지, 귓불에서 검상돌기까지를 더한 길이로 잰다. 오답: ①귓불까지만 재면 길이가 부족함 ③코에서 검상돌기까지 직선으로 재는 것은 부정확 ④귀를 기준점으로 시작하는 것은 잘못된 측정법 ⑤20cm 고정값은 개인의 신체 차이를 반영하지 못함.",
    91:"정답 ④ 등척성 운동은 관절을 움직이지 않고 특정 근육을 강화하는 운동이다. 오답: ①능동 운동은 관절 움직임을 동반 ②수동 운동은 타인이 대신 시행 ③등장성 운동은 근육 길이가 변하며 움직임을 동반 ⑤등속성 운동은 일정한 속도로 관절을 움직이는 운동.",
    92:"정답 ⑤ 무거운 물건을 들 때는 등을 펴고 무릎을 구부린다. 오답: ①무의식 환자의 발처짐 예방에는 발받침대가 적절(대전자 두루마리는 고관절 외회전 방지용) ②물건을 잡을 때는 손가락보다 손바닥 전체를 사용하는 것이 안전 ③무거운 물건을 들 때는 허리 근육이 아닌 다리 근육을 사용해야 함 ④수액을 맞고 있는 팔은 옷을 입힐 때 먼저, 벗길 때는 나중에 처리.",
    93:"정답 ② 혼돈환자가 몸에 삽입된 튜브 등을 제거하는 것을 방지하기 위해서는 장갑 보호대를 적용한다. 오답: ①재킷 보호대는 주로 낙상 방지 목적 ③④⑤(팔꿈치·홑이불·재킷 보호대)는 각각 다른 상황(정맥주사 부위 보호, 전신 억제 등)에 사용되는 보호대로 이 상황의 목적과 차이가 있음.",
    94:"정답 ③ 더운물 주머니에는 물을 1/2~2/3 정도만 채운다(가득 채우면 무겁고 피부에 밀착되지 않음). 오답: ①30~32℃는 너무 낮아 온열 효과가 없으며 약 50℃ 전후가 적정 ②1시간 이상 적용하면 화상 위험이 있어 20분 이내로 제한 ④공기를 채우면 열전달이 나빠지므로 공기는 빼야 함 ⑤출혈 부위에 더운물을 대면 혈관이 확장되어 출혈이 늘어나므로 금기이며, 지혈에는 냉요법을 적용한다.",
    95:"정답 ④ 소변은 배설량에 포함된다. 오답: ①가글액은 뱉어내므로 섭취량·배설량 어디에도 포함하지 않음 ②발한과 ⑤호흡으로 소실되는 수분은 불감성 소실로 측정 배설량에 넣지 않음 ③정상 대변은 배설량에 포함하지 않으며 설사변일 때만 포함한다.",
    96:"정답 ⑤ 음식을 먹다가 기도폐쇄 증상을 보이면 먼저 '목에 뭐가 걸렸나요?'라고 물어 의식과 상태를 확인한다. 오답: ①②③④는 상태 확인 없이 먼저 시행하기에는 순서상 부적절.",
    97:"정답 ② 코삽입관(비강캐뉼라)은 주로 낮은 농도의 산소를 공급할 때 사용한다. 오답: ①1시간마다 제거할 필요는 없고 필요 시 청결을 유지하면 됨 ③코로 들어온 산소를 흡입해야 하므로 입 호흡을 격려하지 않음 ④코삽입관은 말하기와 식사가 가능한 것이 오히려 장점 ⑤습윤병은 생리식염수가 아니라 멸균증류수로 채운다.",
    98:"정답 ② 기관절개관 내관 소독에는 과산화수소수를 사용한다(거품이 일면서 굳은 분비물과 가피를 효과적으로 제거). 오답: ①알코올은 점막을 자극하고 튜브 재질을 손상시킬 수 있음 ③붕산수는 세척력이 약해 내관 소독에 부적합 ④클로르헥시딘과 ⑤베타딘은 피부·점막 소독제로, 내관 세척용 표준 소독액으로는 사용하지 않는다.",
    99:"정답 ④ 염증의 국소반응으로 발적, 종창이 나타난다. 오답: ①식욕저하, ②맥박수증가, ③무기력, ⑤오한·발열은 염증의 전신반응에 해당(국소반응 아님).",
    100:"정답 ④ 붕대는 상처 부위에서 시작하거나 끝내지 않는다. 오답: ①붕대는 말단에서 몸통 방향으로 감음(몸통에서 말단 방향 아님) ②관절은 약간 구부린 상태에서 감는 것이 원칙(완전히 편 상태 아님) ③손가락·발가락 끝은 순환 관찰을 위해 노출시키는 것이 원칙 ⑤젖은 드레싱이 있을 경우 조이지 않고 느슨하게 감아야 함.",
    101:"정답 ① 수술 당일 아침에는 활력징후를 측정한다. 오답: ②금식 교육은 수술 전날 미리 이루어짐 ③매니큐어 제거는 준비 단계 중 하나이나 당일 아침 최우선 순위는 활력징후 측정 ④귀중품 보관, ⑤수술동의서 작성은 이전 단계에서 처리되어야 하는 절차.",
    102:"정답 ③ 수술 후 심호흡과 기침으로 예방할 수 있는 호흡기 합병증은 무기폐이다. 오답: ①급성기관지염, ②폐기종, ④기관지확장증, ⑤폐고름집(폐농양)은 심호흡·기침만으로 직접 예방되는 합병증이 아님.",
    103:"정답 ④ 시각장애 환자와 대화할 때는 사물의 위치를 시계 방향으로 설명한다. 오답: ①환자의 옆이 아니라 정면이나 인지하기 쉬운 위치에서 대화 ②'여기, 이쪽' 같은 지시대명사는 시각장애 환자가 이해하기 어려움 ③최대한 큰 목소리보다 명확한 어조가 중요(시각장애는 청력과 무관) ⑤간호조무사 기준의 좌우 설명은 환자에게 혼동을 줄 수 있음.",
    104:"정답 ④ 근육주사 시 내관을 약간 당겨보아 혈관에 들어가지 않았는지 확인한다. 오답: ①3개월 영아의 예방접종은 대퇴부(넓적다리) 근육에 주사(엉덩이 아님, 좌골신경 손상 위험) ②주사침은 신속하고 정확하게 찌르고 천천히 뽑는 것이 원칙(반대 설명) ③근육주사가 모든 상황에서 가장 빠른 효과를 낸다고 단정할 수 없음(정맥주사가 더 빠름) ⑤근육주사 후에는 문지르지 않고 가볍게 눌러주는 것이 맞으나 '꼭 누른다'는 표현은 과도한 압박을 뜻해 부적절.",
    105:"정답 ③ '우리 아이 졸업할 때까지만 살게 해주세요'라는 말은 임종의 협상단계에 해당한다. 오답: ①부정단계는 진단·상황 자체를 받아들이지 못하는 반응 ②분노단계는 화를 내거나 원망하는 반응 ④우울단계는 상실감에 슬퍼하는 반응 ⑤수용단계는 상황을 받아들이고 평온해지는 반응."
  },
  2: {
    1:"정답 ① 검체 운반은 간호조무사의 업무에 해당한다. 오답: ②상처 드레싱, ③검사결과 통보, ④처방, ⑤치료경과 상담은 간호사·의사의 고유 업무 영역으로 간호조무사 업무범위를 벗어난다.",
    2:"정답 ④ 간호·간병 통합서비스는 보호자 상주 없이 간호인력이 포괄적으로 제공하는 입원서비스이다. 오답: ①②③⑤(기능적간호·팀간호·전담적간호·재활간호)는 각각 다른 간호전달체계·서비스로 '보호자 상주 없이 포괄 제공'이라는 정의와 일치하지 않는다.",
    3:"정답 ② 쾌적한 환경을 위해 가장 중요한 요소는 환기이다. 오답: ①습도, ③온도, ④소음방지, ⑤광선도 중요하나 공기 순환(환기)이 가장 기본이 되는 요소로 꼽힌다.",
    4:"정답 ④ 일반의료 폐기물 용기는 노란색이다. 오답: ①손상성폐기물 용기는 노란색(붉은색 아님) ②격리의료폐기물 용기는 검정색 상자 ③조직물류폐기물 용기는 붉은색 전용용기 ⑤생물화학폐기물은 전용용기를 쓰며 색상이 단순히 녹색으로 규정되지 않는다.",
    5:"정답 ③ 소뇌는 몸의 평형과 골격근 운동을 조절한다. 오답: ①대뇌는 고등정신기능 담당 ②척수는 반사·신경전도 통로 ④연수는 호흡·심박 등 생명중추 ⑤시상은 감각신호 중계소로 각각 기능이 다르다.",
    6:"정답 ③ 혈소판은 혈액응고에 관여한다. 오답: ①적혈구는 산소운반 ②백혈구는 면역·방어 기능 ④알부민은 삼투압 유지 혈장단백질 ⑤섬유소원(피브리노젠)은 혈장 내 응고인자이나 혈구 자체는 아니다.",
    7:"정답 ② 모르핀 투여 시 호흡억제 여부를 관찰해야 한다. 오답: ①③④⑤(혈압·체중·체온·맥박)도 참고 지표이나 마약성 진통제의 가장 치명적인 부작용은 호흡억제이므로 호흡 관찰이 최우선이다.",
    8:"정답 ② 아미노필린, 살부타몰은 기관지 확장제이다. 오답: ①수면유도제, ③강심제, ④이뇨제, ⑤혈압강하제는 전혀 다른 약리작용 분류로 두 약물의 실제 용도(천식·COPD 치료)와 맞지 않는다.",
    9:"정답 ④ 결핵약 복용 시 피리독신(비타민 B6)을 함께 복용하여 신경장애를 예방한다. 오답: ①싸이아민(B1), ②리보플라빈(B2), ③나이아신(B3), ⑤엽산(B9)은 각기 다른 결핍증과 관련된 비타민으로 이소니아지드 유발 말초신경병증 예방에 특이적인 것은 B6이다.",
    10:"정답 ② 수술 후에는 단백질과 아스코브산(비타민C) 섭취가 권장된다. 오답: ①③④⑤조합은 상처 치유에 핵심적인 '단백질+비타민C' 조합과 일치하지 않는다(칼슘·탄수화물 위주 조합은 상처치유 촉진 효과가 상대적으로 낮음).",
    11:"정답 ① 발치 후 솜은 1~2시간 정도 물고 있는다. 오답: ②입에 고인 혈액은 삼키지도 뱉지도 않고 자연스럽게 두어야 함(과도하게 뱉으면 재출혈 위험) ③발치 당일 칫솔질은 피해야 함(출혈 자극) ④지혈 되어도 자극적이지 않은 유동식부터 시작 ⑤발치 당일에는 오히려 베개를 높여 출혈을 줄인다.",
    12:"정답 ③ 진공흡입기의 팁은 이거울(치경)을 가리지 않도록 한다. 오답: ①의사만 다루는 도구가 아니라 간호조무사도 보조 사용 가능 ②치아에 직접 닿게 대면 손상 위험 ④팁은 매 환자·필요시 교환하며 1일 1회로 고정되지 않음 ⑤진료 중에도 지속적으로 사용하는 것이 일반적.",
    13:"정답 ⑤ 오장 중 신(腎)은 공포(恐)의 감정과 연관된다. 오답: ①간은 분노(怒) ②심은 기쁨(喜) ③비는 사려(思) ④폐는 슬픔(悲)과 연관되는 것으로 분류된다.",
    14:"정답 ④ 두통이 있을 때는 침요법이 가능하다. 오답: ①지나치게 배부를 때, ②몹시 피곤할 때, ③갈증이 심할 때는 침 시술 시 어지러움 등 부작용 위험이 있어 신중해야 하는 상황 ⑤암 부위 자체에 직접 시술하는 것은 금기에 해당한다.",
    15:"정답 ② 노인과 대화 시 얼굴을 마주보며 천천히 말한다. 오답: ①옆에 나란히 앉으면 입 모양을 볼 수 없어 이해가 어려움 ③크고 높은 톤보다 낮고 명확한 톤이 청력 저하 노인에게 더 효과적 ④보청기 출력을 무조건 높이면 오히려 불편함 ⑤여러 내용을 한 번에 질문하면 혼동되므로 하나씩 질문해야 한다.",
    16:"정답 ② 가래검사는 기침을 하여 침이 아닌 가래를 뱉도록 한다. 오답: ①금식은 불필요하며 아침 첫 가래가 적절 ③클로르헥시딘 같은 소독액 가글은 검사를 방해하므로 일반 물로 가글 ④가래배양검사는 멸균용기를 사용(종이컵 아님) ⑤일반검사와 배양검사는 채취 용기·무균 정도가 다르다.",
    17:"정답 ① 청색증이 있는 천식환자에게는 처방된 기관지확장제 투여를 돕는다. 오답: ②금식은 이 상황의 응급처치와 무관 ③측위보다 좌위·반좌위가 호흡을 돕는 자세 ④모르핀은 호흡억제 위험이 있어 천식 환자에게 금기 ⑤가슴 냉찜질은 기관지를 수축시켜 오히려 악화시킬 수 있다.",
    18:"정답 ① 요독증이 있는 신부전 환자는 저단백 식이가 권장된다. 오답: ②③④⑤(고염·고지방·고포타슘·고인)는 모두 신부전 환자에게 오히려 제한이 필요한 영양소이다(나트륨·칼륨·인 축적 위험).",
    19:"정답 ③ 동정맥루를 하지 않은 팔에서 채혈한다. 오답: ①시술 후 보통 2주 이상의 성숙 기간이 필요하다 ②진동(스릴)이 느껴지는 것은 정상 소견(소실 시 즉시 보고) ④동정맥루가 있는 팔은 혈류를 방해하므로 혈압 측정 금지 ⑤시계·장신구는 압박 위험이 있어 착용 금지.",
    20:"정답 ⑤ 어떠한 자극에도 반응하지 않고 수의운동이 전혀 없는 상태는 혼수이다. 오답: ①명료는 정상 의식 ②기면은 졸리나 자극에 반응 ③혼미는 강한 자극에 반응 ④반혼수는 약한 반응이 남아있는 상태로 혼수보다 가벼운 단계이다.",
    21:"정답 ① 골다공증은 여성 노인의 고관절 골절을 일으키는 주요 원인이다. 오답: ②추간판탈출(중)은 디스크 질환 ③골관절염은 관절연골 마모(골절의 직접 원인은 아님) ④류마티스관절염은 자가면역성 관절염 ⑤손목굴증후군(수근관증후군)은 신경 압박 질환으로 고관절 골절과 무관하다.",
    22:"정답 ⑤ 위절제술 환자에게 나타나는 빠른비움증후군(덤핑증후군)의 증상은 어지러움·두근거림(심계항진)이다. 오답: ①고열·변비, ②위천공·구토, ③혈변·객혈, ④토혈·설사는 덤핑증후군의 전형적 증상(식후 저혈당·혈관운동 증상)과 다른 별개의 소견이다.",
    23:"정답 ② 임신 12주 무통성 질출혈 후 황체호르몬 주사로 임신이 유지되는 경우는 절박유산이다. 오답: ①계류유산은 태아가 사망했으나 배출되지 않은 상태 ③습관유산은 3회 이상 반복된 자연유산 ④불완전유산은 태아·태반 일부만 배출된 상태 ⑤완전유산은 전부 배출된 상태로 모두 임신 유지가 불가능한 상황을 전제한다.",
    24:"정답 ⑤ 난소는 여성호르몬(에스트로겐·프로게스테론)을 분비하는 기관이다. 오답: ①난소는 고환에 해당하며 부고환에 해당하는 것이 아님 ②착상은 자궁내막에서 이루어짐(난소 아님) ③난자를 자궁으로 이동시키는 것은 난관의 역할 ④수정이 이루어지는 곳도 난관이다.",
    25:"정답 ③ 38주 임부가 파막 후 24시간 이상 분만이 지연되면 자궁 내 감염 위험이 있다. 오답: ①태동 증가, ②자궁 이완, ④태아 체중 감소, ⑤태아 하강감은 장시간 파막 상태의 직접적이고 즉각적인 위험 징후로 보기 어렵다(감염이 가장 임상적으로 중요한 위험).",
    26:"정답 ⑤ 신생아 아프가 점수 항목에는 맥박(심박수)이 포함된다. 오답: ①신장, ②체중, ③흉위는 신체 계측 항목이지 아프가 점수 항목이 아니며 ④혈압도 아프가 5항목(심박수·호흡·근긴장도·반사흥분성·피부색)에 포함되지 않는다.",
    27:"정답 ① 설사로 탈수가 심한 영아는 금식 후 정맥으로 전해질을 보충한다. 오답: ②앙와위나 측위가 일반적이며 복와위는 권장되지 않음 ③직장체온 측정은 탈수 상태에서 점막 자극 우려가 있어 신중해야 함 ④급성 설사기에는 고섬유질 식이가 오히려 자극이 됨 ⑤체위변경은 오히려 필요한 간호(순환·욕창 예방)이다.",
    28:"정답 ③ 3세 아동이 울며 떼쓰다 지쳐 잠드는 증상은 분노발작이다. 오답: ①분리불안은 양육자와 떨어질 때의 불안 반응 ②퇴행은 이전 발달단계 행동으로 되돌아가는 것 ④거부증은 지시에 불응하는 행동 ⑤주의산만은 집중력 저하를 의미해 이 상황과 다르다.",
    29:"정답 ⑤ 초유는 분만 후 2~3일 동안 분비된다. 오답: ①초유는 진하고 노란빛을 띰(묽고 흰색인 것은 성숙유) ②초유는 성숙유보다 지방 함량이 적음 ③초유는 오히려 무기질·단백질 함량이 많음 ④초유는 장운동을 촉진해 태변 배출을 돕는다(변비 유발 아님).",
    30:"정답 ⑤ 노인은 혈관 저항이 증가하는 신체적 변화가 나타난다. 오답: ①심박출량, ②폐활량, ③기초대사량, ④골밀도는 모두 노화에 따라 감소하는 항목으로 '증가'와는 반대된다.",
    31:"정답 ③ 노인 우울증은 가족 상실이 큰 원인이다. 오답: ①여성에게 더 흔함(남성이 흔하다는 설명은 오답) ②내향적이고 소극적인 성격에서 더 흔함 ④신체 증상으로 위장되어 오히려 진단이 어려움 ⑤사고의 경직성은 오히려 증가하는 경향이 있다.",
    32:"정답 ⑤ 노인 낙상 예방을 위해 밤에는 보조등이나 간접조명을 켜둔다. 오답: ①침상 높이는 오히려 낮게 조절해야 함 ②보조기구 없이 걷게 하는 것은 낙상 위험을 높임 ③서서 옷 입기보다 앉아서 입는 것이 안전 ④굽이 높고 미끄러운 신발은 낙상 위험을 높인다.",
    33:"정답 ① 발목을 삔 염좌 환자의 간호로 압박붕대를 감아준다. 오답: ②뻔 다리는 아래로 내리지 않고 올려야(거상) 부종이 줄어듦 ③마사지는 부종·출혈을 악화시킬 수 있어 금기 ④통증에도 움직이도록 권장하는 것은 급성기에 부적절 ⑤급성기에는 더운물이 아닌 냉찜질이 원칙이다.",
    34:"정답 ② 못이나 칼 같은 날카로운 도구에 찔린 상처는 자상이다. 오답: ①찰과상은 긁힌 상처 ③열상은 찢어진 상처 ④벤상처(절상)는 베인 상처(찔린 상처인 자상과 구분) ⑤박리(결출)는 피부가 벗겨지듯 분리된 상처이다.",
    35:"정답 ③ 열피로로 쓰러진 노동자에게 응급처치로 강심제를 줄 수 있다는 것이 정답으로 제시되어 있으나, 실제로는 강심제 투여가 의료행위에 해당하여 간호조무사가 임의로 시행할 수 없다는 점에 유의해야 한다(문제집 표기 기준 정답 확인). 오답: ①산소 공급은 상황에 따라 도움이 되나 이 문항의 정답은 아님 ②따뜻한 물을 먹이는 것은 의식이 명료할 때만 가능하며 우선순위가 아님 ④얼음물 목욕은 급격한 체온 변화로 오히려 위험할 수 있음 ⑤상체를 높이는 것보다 서늘한 곳으로 옮기고 옷을 느슨하게 하는 것이 우선이다.",
    36:"정답 ② 결석이 잦은 노인에게는 가정방문을 통한 개별교육이 적합하다. 오답: ①③④⑤(집단교육·강연회·팜플릿·자조집단)는 거동이 불편한 노인에게 접근성이 낮은 교육방법으로 개별 가정방문이 가장 적합하다.",
    37:"정답 ④ 5~10명이 자유롭게 의견을 나누는 토의 방법은 집단토의이다. 오답: ①심포지엄은 전문가 발표 형식 ②패널토의는 소수 전문가의 토론을 청중이 듣는 형식 ③분단토의는 큰 집단을 소그룹으로 나누는 방식 ⑤브레인스토밍은 자유로운 아이디어 발산 기법으로 결론 도출이 목적이 아니다.",
    38:"정답 ② 수업 중에 시행하여 이해도와 참여도를 파악하는 평가는 형성평가이다. 오답: ①진단평가는 사전 수준 파악 목적 ③④(과정평가·영향평가)는 표준 평가 분류 용어가 아니거나 다른 맥락에서 쓰임 ⑤결과평가는 사후 전체 평가이다.",
    39:"정답 ③ 보건교육을 실시할 때 가장 먼저 해야 할 일은 요구도 파악이다. 오답: ①②④⑤(목표설정·교육실행·계획설정·평가)는 요구도 파악 이후 순차적으로 진행되는 단계이다.",
    40:"정답 ③ 국가 간 건강수준 비교에 가장 중요한 보건지표는 영아사망률이다. 오답: ①조출생률, ②조사망률, ④비례사망률, ⑤발생률도 지표이나 사회경제·문화적 영향을 적게 받고 민감도가 높은 영아사망률이 국제 비교의 표준 지표로 쓰인다.",
    41:"정답 ⑤ 공공재원은 보건의료체계 구성요소 중 경제적 지원에 해당한다. 오답: ①정보, ②자원, ③기술, ④규제는 각각 다른 구성요소(정보체계·자원조직·관리 등)에 해당하며 경제적 지원과는 구분된다.",
    42:"정답 ④ 마을 건강원 운영은 1차 보건의료 구성요소 중 주민의 참여에 해당한다. 오답: ①접근성, ②수용가능성, ③지불가능성, ⑤공공성은 각각 다른 구성요소로, 지역주민이 직접 참여·운영하는 활동과는 개념이 다르다.",
    43:"정답 ① 우리나라 국민건강보험의 보험자는 국민건강보험공단이다. 오답: ②현물급여(의료서비스 제공)가 원칙이며 현금급여가 원칙은 아님 ③보험료는 소득·재산 등 부과기준에 따라 산정되며 개인의 위험정도로 부과되지 않음 ④모든 국민이 아니라 의료급여 수급권자 등은 제외될 수 있음 ⑤보험료는 균등이 아닌 소득 비례 등 차등 부과가 원칙이다.",
    44:"정답 ① 방문요양은 노인장기요양급여 중 재가급여에 해당한다. 오답: ②가족요양비는 특별현금급여 ③노인요양시설, ⑤노인요양공동생활가정은 시설급여에 해당 ④노인복지주택은 노인복지법상 주거복지시설로 장기요양급여 항목이 아니다.",
    45:"정답 ④ 진료비 지불제도 중 행위별수가제는 서비스의 질이 높다는 장점이 있다(의료행위 각각에 수가를 매겨 충분한 진료가 이루어짐). 오답: ①진료비 억제, ③예방중심 의료서비스, ⑤과잉진료 예방은 오히려 총액계약제·인두제 등 다른 지불제도의 장점이며 행위별수가제는 반대로 과잉진료 우려가 있음 ②행정절차가 간단한 것도 아니며 항목별 청구로 절차가 복잡하다.",
    46:"정답 ② 다수인이 밀집한 실내에서 불쾌감·두통 등을 일으키는 현상은 군집독이다. 오답: ①열섬현상은 도심 온도 상승 현상 ③지구온난화, ⑤엘니뇨현상은 광범위한 기후 현상 ④기온역전은 대기오염이 정체되는 기상 현상으로 밀집 실내의 국소적 불쾌감과는 범위가 다르다.",
    47:"정답 ② 인체에서 비타민D 합성과 살균에 관여하는 광선은 자외선이다. 오답: ①전리방사선, ③적외선, ④가시광선, ⑤X선은 각각 다른 파장 영역으로 비타민D 합성·살균 작용과 직접 관련이 적다.",
    48:"정답 ① 용존산소량(DO)이 높을수록 수질오염도가 낮다. 오답: ②대장균은 검출 자체가 오염의 지표이며 일정량까지 허용되는 것이 아님 ③온도가 높은 물은 오히려 DO가 낮아짐(깨끗함과 무관) ④생화학적산소요구량(BOD)이 낮으면 오염이 적은 물이므로 '낮으면 오염된 물'이라는 설명은 반대로 되어 있어 오답 ⑤화학적산소요구량(COD)이 높으면 오염이 심한 것으로 DO는 오히려 낮아진다(반비례).",
    49:"정답 ④ 식품의 물리적 보존법 중 수분을 15% 이하로 유지하여 부패를 방지하는 것은 건조법이다. 오답: ①염장법은 소금 농도를 이용 ②당장법은 설탕 농도를 이용 ③밀봉법은 공기를 차단하는 방법 ⑤냉장법은 저온으로 보관하는 방법으로 수분 조절과는 원리가 다르다.",
    50:"정답 ③ 대체(대치)는 유해인자를 제거하거나 덜 위험한 것으로 변경하는 방법이다. 오답: ①격리는 유해인자와 작업자를 분리하는 것 ②환기는 공기를 순환시켜 농도를 낮추는 것 ④교육은 인식 개선을 통한 예방 ⑤보호구 착용은 개인 방어 수단으로, 유해인자 자체를 변경하는 것과는 다른 접근이다.",
    51:"정답 ⑤ 질병 발생의 생물학적 요인에 해당하는 것은 바이러스이다. 오답: ①유해가스, ②중금속, ③살충제는 화학적 요인 ④진동은 물리적 요인으로 생물학적 요인과 구분된다.",
    52:"정답 ④ 질병의 2차 예방에 해당하는 것은 건강검진이다. 오답: ①성인병 예방 건강교육, ②독감 예방접종, ③칫솔질 교육은 질병 발생 자체를 막는 1차 예방 ⑤뇌졸중 재활치료는 후유증을 최소화하는 3차 예방에 해당한다.",
    53:"정답 ① 모기가 매개하는 감염병은 말라리아이다. 오답: ②페스트는 벼룩이 매개 ③손발입병(수족구병)은 접촉·비말로 전파 ④⑤장티푸스·파라티푸스는 오염된 물·음식을 통한 수인성 감염병이다.",
    54:"정답 ③ 독감 예방접종 후 획득되는 면역은 인공능동면역이다. 오답: ①선천면역은 태어날 때부터 갖는 비특이적 면역 ②자연능동면역은 실제 감염 후 획득 ④자연수동면역은 모체에서 태반·모유로 전달받는 항체 ⑤인공수동면역은 항체(면역글로불린)를 직접 주입받는 방식으로 예방접종과는 원리가 다르다.",
    55:"정답 ⑤ 민물고기를 생식하면 간흡충에 감염될 수 있다. 오답: ①회충, ②요충, ③편충은 채소·토양 매개 기생충 ④폐흡충은 민물게·가재를 생식할 때 감염되는 기생충으로 민물고기와는 매개 식품이 다르다.",
    56:"정답 ④ 생산연령인구가 유출되어 15~64세 인구 비율이 낮은 농촌형 인구구조는 표주박형이다. 오답: ①피라미드형(출생·사망 모두 많은 개발도상국형), ②종형(저출산 안정형), ③항아리형(저출산·고령화형), ⑤별형(생산연령 유입이 많은 도시형)은 농촌의 인구 유출 특징과 맞지 않는다.",
    57:"정답 ⑤ 모성과 아동의 건강은 다음 세대 국민건강에 영향을 미치므로 모자보건 사업이 중요하다. 오답: ①모자보건 대상자는 전체 인구의 약 30%가 맞을 수 있으나 이는 중요성의 핵심 근거가 아님 ②모성과 아동은 오히려 질병 이환률이 높은 취약계층 ③모성과 아동의 질병은 사망률이 낮지 않고 오히려 위험도가 높음 ④모성·아동 질병은 예방 가능한 경우가 많아 사업의 실익이 크다.",
    58:"정답 ④ 고혈압이 있는 산모는 정기적 관찰이 필요한 고위험 임부이다. 오답: ①풍진 항체 보유자는 오히려 면역이 있어 안전한 상태 ②22세 초산모, ③30세에 3.2kg 정상 체중아를 분만한 경험이 있는 산모, ⑤32세 임부는 모두 정상 범위의 연령·분만력으로 고위험 기준에 해당하지 않는다.",
    59:"정답 ③ 예방접종 후 30분은 병원에 머무르며 이상반응을 관찰해야 한다. 오답: ①접종 당일 목욕은 피하는 것이 권장됨 ②열이 있으면 접종을 연기해야 하며 해열제를 먹이고 접종을 강행하지 않음 ④형제자매 동반은 감염 노출 위험이 있어 권장되지 않음 ⑤오전·오후보다 접종 후 이상반응 관찰 여부가 더 중요하다.",
    60:"정답 ④ 가정방문은 미숙아-임산부-성병환자-결핵환자 순으로 진행한다(감염 위험이 낮은 대상부터 높은 대상 순서). 오답: ①②③⑤는 감염 전파를 최소화하는 방문 순서 원칙(비감염·취약 대상 먼저, 감염성 질환자는 나중)과 순서가 어긋난다.",
    61:"정답 ① 퇴원 후 환자들이 모여 서로의 고통을 이해하고 경험을 공유하는 모임은 자조모임이다. 오답: ②거주지 재활, ③정신건강복지센터, ④직업재활, ⑤사회복귀시설은 각각 전문 인력이 운영하는 별도의 프로그램·기관으로 당사자 간 자발적 모임인 자조모임과는 개념이 다르다.",
    62:"정답 ② 환자나 간호조무사 모두에게 생각을 정리할 기회를 주는 치료적 의사소통법은 침묵이다. 오답: ①수용은 있는 그대로 받아들이는 것 ③반영은 감정을 되비추어 주는 것 ④경청은 주의 깊게 듣는 것 ⑤직면은 모순을 짚어주는 것으로, 말없이 기다려주며 생각을 정리하게 하는 것은 침묵이다.",
    63:"정답 ② 낮 시간 동안만 참여하여 출퇴근 형식으로 이용하는 정신재활 프로그램은 낮병원 프로그램이다. 오답: ①중간거주지 프로그램은 주거 지원 중심 ③자조집단 프로그램은 당사자 모임 ④거주지 재활 프로그램은 생활 지원 중심 ⑤사회기술훈련 프로그램은 특정 기술 습득이 목적으로, '출퇴근 형식'이라는 조건과 가장 잘 맞는 것은 낮병원이다.",
    64:"정답 ④ 노인장기요양보험의 보험자는 국민건강보험공단이다. 오답: ①가입자는 저소득층에 한정되지 않고 국민건강보험 가입자 전체가 대상 ②국민건강보험과는 별도 회계로 운영됨(통합 회계 아님) ③만성폐쇄폐질환은 노인성 질병 기준에 해당하지 않아 55세로는 수급자가 될 수 없음 ⑤장기요양급여는 국민건강보험공단에 신청한다(보건복지부 아님).",
    65:"정답 ② 의료법상 의료인이나 의료기관 개설자가 10년 동안 보관해야 하는 자료는 수술기록이다. 오답: ①처방전은 2년 ③간호기록부는 5년(수술기록과 보관기간이 다름) ④검사소견기록은 5년 ⑤진단서는 3년 등으로 보관 기간이 서로 다르게 규정되어 있다.",
    66:"정답 ④ 정신건강 사회복지사는 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률상 정신건강전문요원에 해당한다. 오답: ①정신건강 의사는 별도의 전문의 자격 체계로 '정신건강전문요원' 법정 명칭과 다름 ②정신건강 부양의무자는 가족관계 관련 용어로 전문요원 자격이 아님 ③정신건강 상담사도 전문요원에 해당하나 이 문항의 정답 선지는 사회복지사 ⑤정신건강 물리치료사는 해당 법상 전문요원으로 규정되어 있지 않다.",
    67:"정답 ② 결핵예방법상 의료기관에 소속되지 않은 의료인이 결핵환자를 발견했을 때는 관할 보건소장에게 신고해야 한다. 오답: ①보건복지부장관, ③질병관리청장, ④시·도지사, ⑤시장·군수·구청장은 결핵예방법상 1차 신고 대상 기관이 아니다(1차 신고는 관할 보건소장).",
    68:"정답 ② 구강보건법상 학교구강보건사업에서 불소양치사업을 주 1회 하는 경우 불소 농도는 0.2%이다. 오답: ①0.1%, ③0.05%(매일 시행 시 사용하는 농도), ④0.5%, ⑤2%는 주 1회 사업의 표준 농도와 다르다.",
    69:"정답 ⑤ 혈액관리법상 수혈비용을 보상하거나 헌혈사업에 사용할 목적으로 혈액원이 보건복지부장관에게 예치하는 금액은 헌혈환급예치금이다. 오답: ①②③④(수혈보상금·헌혈환급적립금·헌혈예치금·헌혈적립금)는 유사한 명칭이나 법적 정식 명칭이 아니다.",
    70:"정답 ⑤ 감염병의 예방 및 관리에 관한 법률상 보건소를 통해 접종할 수 있는 필수예방접종 항목에는 일본뇌염이 포함된다. 오답: ①페스트, ③콜레라는 검역·즉시신고 대상 감염병이지 정기 예방접종 항목이 아님 ②매독은 국가필수예방접종 항목이 아님 ④손발입병(수족구병)은 상용화된 국가예방접종 백신이 없다.",
    71:"정답 ① 입원 환자 간호 시 병실이 정돈되었는지 확인한 후 안내한다. 오답: ②입원 시 가지고 온 약은 임의로 복용하지 않도록 설명해야 함 ③귀중품은 간호사실이 아니라 보호자에게 맡기거나 별도 관리(책임 소재 문제) ④감염성 환자 물품은 소독·폐기하며 돌려주지 않음 ⑤노인 환자도 야간 최소 조명을 유지해야 함(전부 끄면 낙상 위험).",
    72:"정답 ① 침상 만들기 시 고무포는 어깨부터 무릎까지 위치한다. 오답: ②베갯잇의 터진 부위는 출입문 반대 방향으로 위치 ③고무포 위에는 밑홑이불이 아니라 당김포를 먼저 깔고 그 위에 별도 처리 ④고열·땀이 많은 환자에게 요람(크래들) 침상은 해당하지 않음(크래들은 화상·골절 등 특수 목적) ⑤민홑이불의 솔기는 아래로 향하게 한다(위로 향하는 것 아님).",
    73:"정답 ③ 주관적 자료에 해당하는 것은 가려움증이다(환자가 직접 느끼는 증상을 말로 표현). 오답: ①복수, ②부종, ④황달, ⑤청색증은 간호조무사가 눈으로 관찰하거나 촉진할 수 있는 객관적 자료에 해당한다.",
    74:"정답 ③ 맥박의 리듬이 빨라졌다 늦어졌다 하는 불규칙한 상태를 부정맥이라 한다. 오답: ①빈맥은 빠른 맥박(리듬 이상이 아닌 속도 이상) ②서맥은 느린 맥박 ④맥박결손은 심첨맥박과 요골맥박의 차이 ⑤심첨맥박은 측정 부위를 가리키는 용어로 리듬 이상 자체를 뜻하지 않는다.",
    75:"정답 ④ 성인 맥박 55회/분은 서맥 경계로 의사나 간호사에게 보고해야 하는 상황이다. 오답: ①신생아 130회/분(정상 120~160), ②영아 90회/분(정상 범위), ③7세 아동 90회/분(정상 범위), ⑤노인 80회/분(정상 범위)은 모두 각 연령대의 정상 범위에 해당한다.",
    76:"정답 ② 배란 시에는 프로게스테론의 영향으로 체온이 높아진다(기초체온 상승). 오답: ①노인은 오히려 체온이 낮아지는 경향 ③수면 중에는 체온이 하강 ④기아(영양 부족) 시 대사가 저하되어 체온이 하강 ⑤월경 시에는 체온이 낮은 편에 속한다.",
    77:"정답 ① 같은 시간에 일어난 일을 서술할 때는 끝에 한 번만 서명한다. 오답: ②활력징후 등 기록은 수정액으로 지우지 않고 두 줄을 긋고 정정 ③3교대 시에는 통일된 검정색 볼펜을 사용하는 것이 원칙이므로 이 문항에서는 정답이 아닌 다른 선지가 핵심 오류를 포함 ④여백은 위변조 방지를 위해 남기지 않음 ⑤투약은 사전이 아닌 시행 후 즉시 기록한다.",
    78:"정답 ⑤ 내과적 손씻기는 흐르는 물에 비누와 마찰을 이용하여 15초 이상 문지르고 총 40~60초간 씻는다. 오답: ①물은 손끝에서 팔꿈치 방향이 아니라 팔꿈치에서 손끝 방향(오염원에서 먼 곳으로)으로 흘려야 함 ②받아놓은 물이 아닌 흐르는 물을 사용 ③손을 씻은 후에는 손이 아닌 팔꿈치나 종이타월로 수도꼭지를 잠금 ④감염병 환자 간호 후 손소독제로 10초 이상 비비는 것도 방법이나 이 문항의 정답은 표준 손씻기 시간을 제시한 ⑤이다.",
    79:"정답 ① 의식을 확인한 후 119에 신고한 다음에는 호흡을 확인해야 한다. 그림 판별 기준: ①번은 한 손으로 이마를 젖히고 다른 손으로 턱을 들어 올려 기도를 연 뒤 호흡을 확인하는 자세(머리기울임-턱들어올리기), ②번은 가슴압박 자세, ③번은 이물 제거·기도 확인 동작, ④번은 인공호흡 자세, ⑤번은 회복자세(옆으로 눕히는 자세)이다. 오답: ②가슴압박은 호흡이 없음을 확인한 다음 단계라 순서가 앞섬 ③④는 호흡 확인 이후 필요시 시행하는 처치 ⑤회복자세는 호흡과 반응이 있는 환자에게 적용하므로 이 상황과 맞지 않는다.",
    80:"정답 ① 전달집게(이동겸자)는 겸자통에서 꺼낼 때 양쪽 면이 맞물린 상태로 꺼낸다. 오답: ②겸자는 한 용기에 하나만 보관(두 개씩 꽂아두면 오염 위험) ③정기적으로 교환(오염 여부와 관계없이) ④겸자를 손에 들고 있을 때는 허리 위쪽에 위치(오염 방지를 위해 허리 아래 금지) ⑤겸자를 소독할 때는 끝이 벌어진 상태로 감싸 멸균포에 싸는 것이 원칙이다.",
    81:"정답 ① 활동성 폐결핵 환자의 격리병실에 들어가기 전에는 N95 마스크를 착용해야 한다. 오답: ②보안경, ③귀마개, ④장갑, ⑤가운도 상황에 따라 필요할 수 있으나 공기매개 감염인 결핵의 핵심 보호구는 N95 마스크이다.",
    82:"정답 ② 허리천자(요추천자) 시에는 새우등 자세(옆으로 누워 무릎을 가슴 쪽으로 당겨 등을 둥글게 구부린 자세)를 취해 척추 사이 공간을 넓혀준다. 오답: ①검사 전 금식은 필수 조건이 아님 ③검사 후에는 두통 예방을 위해 앙와위(누운 자세)를 유지하는 것이 일반적(복와위가 아님) ④요추 1~2번이 아니라 3~4번 또는 4~5번 사이에서 천자한다(척수 손상 방지) ⑤내과적 무균술이 아닌 외과적 무균술을 적용해야 하는 침습적 시술이다.",
    83:"정답 ① 상부위장조영 검사는 검사 전 금식한다. 오답: ②상부위장조영은 경구로 조영제(바륨)를 복용하는 검사로 정맥주사가 아님 ③검사 후에는 설사보다 변비가 더 흔한 부작용 ④조직검사를 동반했다면 복통·혈변 관찰이 필요하나 이 문항의 핵심 정답은 검사 전 금식 ⑤검사 후에는 조영제 배출을 위해 오히려 수분 섭취가 권장된다.",
    84:"정답 ③ 무의식 환자의 특수 구강간호 시 혀에 백태가 있으면 과산화수소수를 사용한다. 오답: ①치아 바깥면과 혀만 닦는 것은 불충분하며 안쪽도 함께 닦아야 함 ②혀 안쪽을 너무 깊게 닦으면 구역반사를 유발할 수 있음 ④전달집게는 환자의 치아에 직접 닿지 않도록 해야 함 ⑤무의식 환자는 흡인 예방을 위해 측위나 반좌위를 취하는 것이 안전하다(앙와위는 흡인 위험이 있어 부적절).",
    85:"정답 ② 삼킴곤란(연하곤란)이 있는 노인의 식사 시에는 보조자가 마비된 쪽을 지지해준다. 오답: ①액체보다 걸쭉한 음식이 흡인 예방에 유리(삼키기 쉬운 액체는 오히려 흡인 위험) ③고개는 앞으로 살짝 숙인 자세가 안전(뒤로 젖히면 흡인 위험) ④가능한 범위에서 스스로 먹도록 돕는 것이 원칙(보조자가 전적으로 먹여주지 않음) ⑤누워서 식사할 경우 마비된 쪽이 아래로 가지 않도록 해야 한다.",
    86:"정답 ④ 성인 환자에게 관장 시 직장관을 배꼽 방향을 향해 부드럽고 천천히 삽입한다. 오답: ①환자는 왼쪽(좌측심즈 자세)으로 눕도록 함(오른쪽 아님) ②관장액 주입 후에는 대개 곧바로 배변 욕구가 오므로 1시간을 기다리게 하지 않음 ③멸균장갑까지는 필요 없고 청결장갑으로 충분 ⑤복통 호소 시에는 즉시 제거보다 주입 속도를 늦추거나 잠시 중단 후 재개하는 것이 우선이다.",
    87:"정답 ② 간경화증 환자의 암모니아 수치를 낮추기 위한 관장은 정체관장이다(락툴로오스 등의 약물을 장 내에 일정 시간 머무르게 하여 암모니아 흡수·배출을 돕는 방식). 오답: ①배출관장은 일반적인 배변 촉진 목적 ③구풍관장은 가스 배출 목적 ④수렴관장은 지혈 목적 ⑤윤활관장은 변을 부드럽게 하는 목적으로 암모니아 저하와는 목적이 다르다.",
    88:"정답 ③ 인공항문(장루)을 가진 환자의 자가간호 목적은 인공항문의 폐색을 예방하고 일정한 시간에 규칙적으로 배변할 수 있도록 유도하기 위함이다. 오답: ①배뇨곤란과는 무관(장루는 배변 관련) ②복수 제거는 별도의 처치(복수천자 등) ④대장 용종 제거는 내시경적 시술 영역 ⑤방광 세척은 비뇨기계 처치로 장루 관리와는 다른 목적이다.",
    89:"정답 ④ 유치도뇨 시 소변 배액주머니는 바닥에 닿지 않도록 한다. 오답: ①도관은 목적 달성 후 바로 제거하지 않고 처방·상태에 따라 유지 ②남자 환자는 삽입 시 침대 곁에 서도록 하는 것이 맞으나 이 문항의 핵심 정답은 배액주머니 위치 ③소독은 요도구에서 항문 방향으로 실시(항문에서 치골 방향이 아님) ⑤유치도관은 매일 교환하지 않고 필요시(오염·폐색 등)에만 교환한다.",
    90:"정답 ② 분만 후 산모의 자궁후굴을 예방하기 위한 자세로 무릎가슴 자세가 적합하다. 오답: ①배횡와위, ③측위, ④골반내진 자세, ⑤반좌위 자세는 자궁후굴 예방의 표준 권장 자세와 다르다.",
    91:"정답 ⑤ 왼쪽 다리가 약한 환자는 보행기와 약한 왼쪽 다리를 먼저 옮긴 후 오른쪽(건강한) 다리를 이동한다. 오답: ①간호조무사는 약한 쪽인 왼쪽 뒤에서 지지해야 함(오른쪽 아님) ②보행기 높이는 팔꿈치가 약 15~30도 구부러지는 높이가 적절(60도는 과도함) ③보행기 높이는 손목 높이가 기준(허리 높이 아님) ④보행기에 지나치게 기대어 이동하는 것은 오히려 불안정할 수 있다.",
    92:"정답 ② 우측 반신마비(편마비) 환자에게 단추가 없는 상의를 벗길 때는 좌측(건강한 쪽)부터 벗긴다. 오답: ①우측(마비된 쪽)부터 벗기면 불편하고 부담이 큼 ③입힐 때는 마비된 쪽(우측)부터 입히는 것이 원칙(좌측부터 입히는 것 아님) ④⑤머리부터 입히는 방식은 목선 의류 등 특정 상황에 한정되며 일반 원칙(마비 쪽부터 입고 건강한 쪽부터 벗음)과는 별개이다.",
    93:"정답 ② 소아의 팔꿈치 부위 정맥주사 또는 입천장(구개)수술 후에는 팔꿈치 보호대를 적용한다. 오답: ①재킷 보호대는 주로 낙상·전신 억제 목적 ③크립 망은 두피 등 특정 부위 고정용 ④홑이불 보호대는 전신을 감싸는 억제법 ⑤손목 보호대는 손목 부위 보호용으로 팔꿈치·구강 부위와는 위치가 다르다.",
    94:"정답 ④ 더운물 주머니는 근육경련이 있는 부위에 적용할 수 있다. 오답: ①화농을 지연시켜야 하는 경우에는 오히려 냉요법이 적절 ②치아 발치 직후는 출혈 위험으로 온요법 금기 ③충수염 의심 시 더운물 적용은 천공 위험을 높여 금기 ⑤편도절제 후에도 출혈 위험이 있어 온요법은 피해야 한다.",
    95:"정답 ① 섭취량 및 배설량 측정 시, 눈금이 있는 소변기에 배뇨한 후 양을 측정하여 기록하도록 교육한다. 오답: ②얼음도 녹으면 섭취량에 포함해 계산해야 함(포함되지 않는다는 설명은 오답) ③정상적인 변은 배설량에 포함하지 않음(설사 시에만 포함) ④배설량이 섭취량보다 많으면 탈수를 의심해야 함(부종이 아님) ⑤섭취량이 배설량보다 많다고 무조건 수분을 보충하는 것은 아니며 상태에 따라 판단한다.",
    96:"정답 ③ 산소투여 시에는 화재 예방을 위해 금연판을 붙여둔다. 오답: ①모직 담요는 정전기로 인한 화재 위험이 있어 피해야 함 ②유량계 내 작은 공의 윗부분이 처방 산소량과 일치하는지 확인하는 것도 맞는 설명이나 이 문항의 정답은 금연판 부착 ④습윤병에는 생리식염수가 아닌 멸균증류수를 채움 ⑤라이터 등 화기는 산소 투여 중인 환자 곁에 절대 두지 않아야 한다.",
    97:"정답 ① 만성폐쇄폐질환 환자에게 산소를 투여할 때 가장 적합한 방법은 코삽입관(비강캐뉼라)이다. 오답: ②비강 카테터, ③단순 안면마스크, ④비재호흡마스크, ⑤부분재호흡마스크는 상대적으로 고농도 산소를 공급하는 기구로 이산화탄소 축적 위험이 있는 COPD 환자에게는 부적합하다.",
    98:"정답 ③ 기도 흡인 시 1회 흡인 시간을 10초 이내로 해야 하는 이유는 저산소증 예방이다. 오답: ①②④⑤(기도폐쇄 예방·불안 감소·출혈 예방·점막손상 예방)도 흡인 시 고려사항이지만 시간 제한의 핵심 이유는 저산소증 예방이다.",
    99:"정답 ② 상처 드레싱 시 장갑을 벗은 후에는 손을 깨끗이 씻는다. 오답: ①드레싱 세트는 시행 직전에 준비 ③외과적 무균술을 적용해야 함(내과적 무균술이 아님) ④드레싱 세트에 혈액이 묻으면 찬물로 먼저 헹군 후 더운물로 씻어야 함(단백질 응고 방지, 순서가 반대로 되어 있음) ⑤수술 당일 출혈로 드레싱이 흠뻑 젖으면 거즈를 제거하지 않고 그 위에 추가로 덧대며 즉시 보고한다.",
    100:"정답 ④ 종아리 부종 감소를 위한 붕대 감기 방법으로 나선절전대(나선역행붕대)가 적합하다. 오답: ①되돌이붕대(회귀대)는 절단 부위나 두부에 사용 ②경사붕대(사행대)는 부목을 고정하는 용도로 압박 효과가 약함 ③환행대(돌림붕대)는 붕대의 시작과 고정에 사용 ⑤8자붕대(8자대)는 관절 부위 고정에 적합하다.",
    101:"정답 ③ 수술 전 피부준비인 삭모 시 제모제를 사용하기 전에 피부 민감성 반응을 확인한다. 오답: ①삭모는 대개 수술 직전(당일)에 시행(3일 전은 감염 위험 증가) ②수술 부위보다 넓게 삭모하는 것이 원칙 ④면도기는 피부와 평행하게(직각이 아님) 밀어야 상처를 예방할 수 있음 ⑤삭모 후 로션 사용은 오히려 감염 위험을 높일 수 있어 권장되지 않는다.",
    102:"정답 ⑤ 수술 직후 아직 의식이 완전히 돌아오지 않은 환자는 금식을 유지한다(흡인 예방). 오답: ①트렌델렌부르크 자세는 특정 목적에만 사용 ②한쪽 침대난간만 올리는 것은 낙상 예방에 불충분(양쪽 모두 올림) ③소변을 참도록 하는 것은 방광 손상 위험 ④통증이 있어도 욕창·무기폐 예방을 위해 체위변경이 필요하다.",
    103:"정답 ④ 조기 이상이 가능한 환자는 위 수술 환자이다. 오답: ①뇌출혈 수술 환자, ②쇼크 환자, ③심근경색증 환자, ⑤눈에 심한 타박상을 입은 환자는 안정과 침상안정이 우선되는 상태로 조기 이상이 금기이거나 신중해야 하는 경우이다.",
    104:"정답 ⑤ 보청기 사용 시 입력은 크게, 출력은 낮게 조절한다. 오답: ①환자 옆이 아닌 정면에서 대화해야 입 모양을 볼 수 있음 ②큰소리로 소리치듯 말하는 것은 오히려 왜곡되어 들릴 수 있음 ③어깨 두드리기 같은 신체 접촉은 주의를 환기하는 데 도움이 될 수 있어 상황에 따라 유용함(하면 안 된다는 설명은 오답) ④대화 시 몸짓(입 모양·표정 등)을 사용하는 것이 오히려 이해에 도움이 된다.",
    105:"정답 ⑤ 투약 시 의문이 가는 처방은 반드시 의사나 간호사에게 확인한다. 오답: ①환자가 가지고 온 약은 임의로 복용하도록 해서는 안 됨 ②약을 준비하는 사람과 투약하는 사람은 원칙적으로 동일해야 함(분리 시 오류 위험) ③경구 투약 시 약은 3번 확인이 원칙(2번이 아님) ④환자 확인은 침상 이름표보다 환자 본인에게 직접 확인(손목밴드·이름·등록번호 등)하는 것이 정확하다."
  }

  health_administration_system: "보건행정 조직과 담당 업무를 짝지어 암기한다: 질병관리청(감염성·만성질환 관리), 보건소(시장·군수·구청장이 보건소장 임명, 보건소법 적용), WHO(국제 보건사업 지휘·조정). 1차 보건의료의 핵심 요소 중 '주민의 참여'는 지속가능성 측면에서 특히 강조된다.",
  ltci: "노인장기요양보험은 국민건강보험공단이 보험자이며, 65세 이상 또는 65세 미만이라도 노인성 질병(치매·뇌혈관질환 등)이 있는 자가 대상이다. 재가급여(방문요양·방문목욕 등)와 시설급여로 나뉘며, 장기요양인정점수에 따라 등급이 결정된다는 구조를 함께 정리한다.",
  environmental_health: "기온역전은 상층 기온이 하층보다 높아 대기오염물질이 확산되지 못하고 정체되는 현상이다. 수질오염 지표는 용존산소량(DO, 높을수록 깨끗)과 생화학적산소요구량(BOD, 높을수록 오염)을 반대 개념으로 짝지어 암기해야 한다. 유해인자 관리 원칙(제거→대체→격리→환기→보호구 순)도 함께 정리한다.",
  population_health_index: "국가 간 건강수준 비교에 가장 널리 쓰이는 지표는 영아사망률이다. 총부양비는 (0~14세 인구+65세 이상 인구)÷15~64세 인구×100으로 계산하며, 인구구조 유형(피라미드형·종형·항아리형·별형·표주박형)의 특징을 함께 구분해 암기한다.",
  maternal_child_health: "모자보건 사업이 중요한 이유는 모성과 아동의 건강이 다음 세대 국민건강에 직결되기 때문이다. 분만전(산전)관리는 모성사망률 감소의 핵심 요소이며, 모자보건법상 대상자 범위(임산부, 영유아, 신생아 등)도 정확히 알아둬야 한다.",
  community_visiting: "가정방문은 감염 위험이 낮은 대상부터 높은 대상 순으로 방문한다(미숙아·임산부 → 학령전기아동 → 성병환자·결핵환자 순). 지역사회 상담에서는 신뢰감 형성이 가장 중요하며, 자조모임은 비슷한 어려움을 겪는 사람들이 경험을 나누는 모임이다.",
  mental_health_care: "치료적 의사소통과 정신재활 프로그램이 핵심이다. 수용은 판단 없이 있는 그대로 받아들이는 것, 경청은 주의 깊게 듣는 것, 반영은 환자의 감정을 되비추어 주는 것, 침묵은 말없이 기다려 스스로 정리할 시간을 주는 것이며, 직면은 환자의 말과 행동의 모순을 짚어 환자와 간호조무사 모두에게 생각을 정리할 기회를 주는 기법이다. 반대로 충고하기, 섣부른 안심시키기, 화제 돌리기, 왜(why)라는 질문은 비치료적 의사소통에 해당한다. 정신재활 프로그램 중 낮병원은 낮 시간에만 출퇴근 형식으로 이용하며 증상이 호전된 후 사회복귀를 돕고, 중간거주지는 퇴원 후 일정 기간 머무는 주거 지원이며, 자조모임은 같은 어려움을 겪는 당사자들이 자발적으로 경험을 나누는 모임이다.",
  elderly_welfare_facility: "노인복지시설은 기능에 따라 구분한다: 노인요양시설(장기입소), 노인요양공동생활가정(소규모 가정형), 재가노인복지시설(방문요양 등), 노인복지관(여가·상담). 심신에 장애가 있어 도움이 필요한 노인에게 가정과 같은 주거여건을 제공하는 곳은 노인요양공동생활가정이다.",
  basic_nursing_infection_control: "감염관리 기본 원칙은 손씻기(흐르는 물에 비누로 40~60초), 사용한 주삿바늘은 재캡핑 없이 바로 폐기, 멸균물품은 오염 시 즉시 교환, 격리병실 출입 시 개인보호구 착용이다. 염증의 국소 4대 증상(발적·종창·열감·통증)과 전신반응(발열·백혈구증가)도 구분해 암기한다.",
  bedmaking_hygiene: "빈 침대는 새로 입원하는 환자를 위한 기본 침상이며, 베갯잇의 터진 부위는 출입문 반대 방향으로 둔다. 침상목욕 시에는 눈은 안쪽에서 바깥쪽으로, 먼 쪽보다 가까운 쪽부터, 상지는 말단에서 몸통 방향으로 닦는 순서 원칙을 지킨다. 무의식 환자의 틀니는 제거해 보관한다.",
  vital_signs_assessment: "심첨맥박은 좌측 빗장뼈 중앙선과 5번째 갈비사이공간이 만나는 지점에서 청진하며, 정상 범위를 벗어난 수치(예: 신생아 심박수 100회/분 미만·180회/분 초과)는 즉시 보고해야 한다. 복부검진은 시진→청진→타진→촉진 순서로 진행하는데, 촉진을 먼저 하면 장운동이 자극되어 청진 결과가 왜곡되기 때문이다.",
  restraint_positioning: "신체보호대는 목적에 맞게 선택한다(재킷보호대-낙상방지, 장갑보호대-혼돈환자의 튜브 제거방지, 손목보호대-정맥주사 부위 보호). 보행 보조 시 간호조무사는 약한 쪽 뒤에서 지지하고, 무거운 물건은 허리가 아닌 무릎을 구부려 다리 근육으로 들어올린다(등척성 운동 원리와 연결).",
  wound_dressing_sterile: "드레싱 교환 시 내과적 무균술을 적용하며, 장갑을 벗은 후에는 반드시 손을 씻는다. 겸자(집게)는 날카로운 부분을 감싸고 끝을 맞물려 보관하며, 가압증기멸균은 120℃에서 50~60분간 진행한다는 수치도 함께 암기해야 한다.",
  elimination_care: "섭취량에는 마시는 물·수액·정맥주사액이, 배설량에는 소변·설사변·구토물·배액량이 포함된다(정상 대변, 정상 발한은 제외). 관장 시 직장관은 배꼽 방향으로 부드럽게 삽입하며, 배출관장은 간경화 환자의 암모니아 수치를 낮추는 목적으로도 사용된다.",
  oxygen_therapy: "코삽입관(비강캐뉼라)은 저농도 산소 공급에 사용되며, COPD 환자처럼 이산화탄소 축적 위험이 있는 경우 고농도 산소 투여를 피해야 한다. 산소투여 시에는 화재 예방을 위해 금연판을 부착하고 화기(라이터 등)를 멀리해야 한다.",
  bandage: "붕대법은 목적에 따라 선택한다: 나선절전대(팔다리처럼 굵기가 변하는 부위, 부종 감소), 환행대(돌림붕대, 붕대 시작·고정), 8자붕대(관절 부위 고정). 붕대는 말단에서 몸통 방향으로, 상처 부위에서 시작하거나 끝내지 않도록 감는다.",
  perioperative_care: "수술 전에는 활력징후 측정, 금식, 동의서 확인, 장신구·매니큐어 제거를 진행하고, 삭모는 제모제 사용 전 피부 민감반응을 먼저 확인한다. 수술 후에는 심호흡·기침으로 무기폐를 예방하며, 조기이상이 가능한 환자(위 수술 등)와 금기 환자(뇌출혈·쇼크 등)를 구분해 암기해야 한다.",
  ostomy_care: "인공항문(장루) 간호에서는 가스형성 음식(양파·무 등)을 피하고, 장루 주변이 돌출되거나 습기가 차면 즉시 보고한다. 장루 자가간호의 목적은 폐색 예방과 규칙적인 배변 습관 형성에 있다.",
  catheter_care: "유치도뇨 시 소변 배액주머니는 방광보다 낮게, 바닥에는 닿지 않게 유지한다(역류 감염 예방). 코위관(레빈튜브) 삽입 길이는 코→귓불→검상돌기까지를 기준으로 하며, 검체 채취 시에는 포트를 소독 후 멸균주사기로 채취한다.",
  hospice_endoflife: "퀴블러로스의 임종 5단계(부정-분노-협상-우울-수용) 중 조건을 걸며 삶을 연장하려는 말(\"아이 졸업할 때까지만…\")은 협상단계에 해당한다. 각 단계별 환자의 심리와 그에 맞는 간호적 접근을 함께 정리해두면 좋다.",
  sensory_impairment_comm: "시각장애 환자와 대화할 때는 시계 방향으로 사물 위치를 설명하고, 난청 환자에게는 큰 소리로 소리치기보다 얼굴을 마주보고 천천히 말하며 보청기는 입력은 크게·출력은 낮게 조절한다. 신체 접촉이나 몸짓의 적절한 사용 여부도 상황에 따라 다르게 출제되니 문항별로 확인이 필요하다.",
  documentation: "간호기록은 사실을 그대로, 시간 순서대로, 지우지 않고(오기 시 두 줄을 긋고 정정) 작성한다. 3교대 근무에서는 통일된 검정색 볼펜(또는 정해진 색)을 사용하고 여백을 남기지 않는 것이 원칙이다.",
  infectious_disease_grade: "감염병예방법은 신고 시기와 격리 필요성을 기준으로 감염병을 4개 급으로 나눈다. 제1급은 치명률이 높거나 집단발생 우려가 커서 '발생 즉시' 신고하고 음압격리가 필요하며 페스트·탄저·두창·에볼라·SARS·MERS·신종인플루엔자·디프테리아 등이 속한다. 제2급은 '전파가능성을 고려해 발생 또는 유행 시 24시간 이내 신고하고 격리가 필요한' 감염병으로 결핵·수두·홍역·콜레라·장티푸스·세균성이질·장출혈성대장균감염증·A형간염·백일해·유행성이하선염·풍진·폴리오·한센병·성홍열 등이 있다. 제3급은 발생을 계속 감시할 필요가 있어 24시간 이내 신고하지만 격리 대상은 아니며 파상풍·B형간염·일본뇌염·C형간염·말라리아·발진티푸스·쯔쯔가무시증·렙토스피라증·브루셀라증·공수병·신증후군출혈열·AIDS 등이 해당한다. 제4급은 표본감시가 필요한 감염병으로 7일 이내 신고하며 인플루엔자·수족구병·회충증·요충증·MRSA·VRE 등이 있다. 시험에서는 '24시간 이내 신고 + 격리 필요'라는 표현이 나오면 제2급을, '즉시 신고'가 나오면 제1급을 떠올리도록 지도하면 좋다.",
  medical_law_records: "의료법 관련 문항은 크게 개설권자와 기록 보관기간으로 나뉜다. 요양병원은 의사·치과의사·한의사가 개설할 수 있고(간호사·조산사·약사는 개설 불가), 의료기관 개설은 원칙적으로 의료인만 가능하다. 진료기록 보관기간은 자주 출제되므로 표로 외우는 것이 좋다: 처방전 2년, 진단서·검안서 3년, 진료기록부·조산기록부·간호기록부·수술기록·환자명부 중 다수가 5년 또는 10년으로 나뉘는데, 특히 간호기록부·수술기록은 10년이다. 숫자가 헷갈릴 때는 '환자 안전과 법적 분쟁 가능성이 클수록 오래 보관한다'는 원리로 접근하면 기억에 도움이 된다.",
  mental_health_law: "정신건강복지법에서 가장 자주 출제되는 것은 입원 유형과 퇴원 요구 처리이다. 자의입원은 환자 본인이 신청하는 것으로, 환자가 퇴원을 요구하면 지체 없이 퇴원시켜야 한다. 보호의무자에 의한 입원은 보호의무자 2명 이상의 신청과 정신건강의학과 전문의의 진단이 함께 필요하며, 입·퇴원에 경찰관의 동의가 요구되지는 않는다. 정신건강전문요원에는 정신건강임상심리사·정신건강간호사·정신건강사회복지사·정신건강작업치료사가 포함되며, '정신건강 의사'나 '정신건강 물리치료사'는 법정 자격이 아니다.",
  oral_health_law: "구강보건법에서는 계획 수립 주기와 불소양치 농도가 핵심이다. 보건복지부장관은 구강보건사업 기본계획을 5년마다 수립하고, 시·도지사와 시장·군수·구청장은 이에 따른 세부계획을 수립·시행한다. 학교 불소양치사업의 불소 농도는 시행 주기에 따라 달라지는데, 매일 시행할 때는 0.05%, 주 1회 시행할 때는 0.2%를 사용한다. '자주 할수록 농도는 낮게'라는 원리로 묶어서 외우면 헷갈리지 않는다.",
  blood_management_law: "혈액관리법 문항은 채혈 전후 절차와 기금 명칭으로 나뉜다. 채혈 전에는 혈압·맥박·체온 등 기본 활력징후와 문진으로 헌혈 적합 여부를 확인하고, AIDS·매독·간기능·B형/C형간염 검사 등은 채혈한 혈액을 대상으로 사후에 시행한다. 헌혈환급예치금은 혈액원이 보건복지부장관에게 예치하는 금액으로, 수혈비용 보상과 헌혈사업에 사용된다. 유사한 명칭(헌혈적립금·수혈보상금 등)이 오답으로 자주 나오므로 정식 명칭을 정확히 익혀야 한다.",
  tracheostomy_airway: "기관절개관 관리의 핵심은 내관 세척과 흡인이다. 내관 소독에는 과산화수소수를 사용하는데, 거품이 일면서 굳은 분비물과 가피를 효과적으로 제거하기 때문이다(알코올·베타딘 등은 점막 자극이나 재질 손상 우려로 부적합). 기도 흡인은 1회 10초 이내로 제한해 저산소증을 예방하고, 흡인 전후로 산소를 공급하며, 카테터를 넣을 때는 음압을 걸지 않고 뺄 때 돌리면서 적용한다. 기관절개 환자는 말하기가 어렵고 기도가 직접 외부와 통하므로 가습과 무균술이 특히 중요하다는 점도 함께 짚어주면 좋다.",
  oral_medication_practice: "경구투약은 투약 5원칙(정확한 대상자·약·용량·경로·시간)을 지키고 약을 꺼낼 때, 덜 때, 되돌려 놓을 때 총 3회 확인한다. 물약은 라벨이 손바닥 쪽으로 오도록 병을 잡고 따라야 약물이 흘러도 라벨이 지워지거나 오염되지 않으며, 눈높이에서 메니스커스(액체 표면 가운데)를 기준으로 계량한다. 가루약은 물에 녹여 투약하고, 철분약은 빨대를 사용해 치아 착색을 예방하며, 설하정은 삼키지 않고 혀 밑에서 녹인다. 약을 준비한 사람이 직접 투약하는 것이 원칙이며, 의문이 드는 처방은 반드시 의사나 간호사에게 확인한 뒤 시행한다.",
  injection_practice: "근육주사는 주사침을 신속하고 정확하게 찌른 뒤 내관(피스톤)을 약간 당겨 혈액이 역류하지 않는지 확인하고, 혈관에 들어가지 않았음을 확인한 후 천천히 약물을 주입한다. 부위는 성인은 배볼기근(둔부 배면)이나 삼각근, 2세 미만 영유아는 좌골신경 손상 위험 때문에 반드시 넓적다리 가쪽넓은근(대퇴부)을 선택한다. 주사 후에는 문지르지 않고 가볍게 눌러주며, 항응고제나 특정 약물은 압박·마사지를 피한다. 피하주사는 45~90도, 피내주사는 15도로 각도가 다르다는 점도 함께 묶어 외우면 좋다.",
  admission_transfer: "입원 시에는 환자가 가지고 온 약을 임의로 복용하지 않도록 설명하고 간호사에게 인계하며, 귀중품은 보호자가 가져가도록 안내한다. 전동(병동 이동) 시에는 의무기록·남은 약·개인물품을 모두 옮길 병동으로 함께 보내고, 원무과에 반납하거나 폐기하지 않는다. 식사 장소 변경이나 검사 일정 조정 등은 환자가 직접 연락하지 않고 간호사를 통해 처리한다. 퇴원 시에는 추후 외래 방문일, 복약 방법, 주의 증상을 교육하고 입원비 정산을 안내한다.",
  lab_specimen: "검체는 종류마다 채취 방법과 보관 조건이 다르다. 일반 소변검사는 중간뇨를 받고 인공도뇨는 하지 않으며, 유치도관이 있는 환자는 배액주머니가 아니라 검체 채취 포트를 소독한 뒤 멸균주사기로 뽑는다. 24시간 소변검사는 시작 시각의 첫 소변은 버리고 이후 모두 모으며 마지막 소변은 포함하고, 도중에 일부를 흘리면 그 시점부터 다시 시작해야 한다. 검사가 지연되면 실온이 아니라 냉장 보관하고, 요추천자·상부위장조영 등 검사는 전처치(금식)와 후처치(자세 유지, 수분 섭취)를 짝지어 정리해두면 좋다.",
  inflammation_response: "염증 반응은 국소반응과 전신반응으로 나눠 외운다. 국소 4대 징후는 발적(붉어짐)·발열(열감)·종창(부어오름)·통증이며 여기에 기능장애를 더해 5대 징후로 보기도 한다. 전신반응으로는 오한과 발열, 백혈구 증가, 맥박·호흡수 증가, 식욕저하, 무기력, 권태감이 나타난다. 시험에서 '국소반응'을 물으면 부위에 나타나는 눈에 보이는 변화를, '전신반응'을 물으면 체온·혈액·전신 컨디션 변화를 고르면 된다.",
  occupational_health: "근로자 건강진단은 시행 목적에 따라 구분한다. 일반건강진단은 모든 근로자를 대상으로 정기적으로 실시하고, 배치전건강진단은 유해업무에 배치하기 전 기초자료 확보를 위해 시행하며, 특수건강진단은 분진·소음·유기용제 등 유해인자에 노출되는 근로자를 대상으로 정기적으로 실시한다. 수시건강진단은 직업병 의심 증상이 나타났을 때, 임시건강진단은 집단 발병 등 특별한 사유가 있을 때 실시한다. 작업환경관리의 기본 원칙은 대치(대체)→격리→환기→교육→보호구 착용 순으로, 유해인자 자체를 없애거나 바꾸는 대치가 가장 근본적인 대책이다.",
  immunity_types: "면역은 획득 경로에 따라 네 가지로 나뉜다. 자연능동면역은 질병을 앓고 난 뒤 스스로 항체를 만든 것이고, 인공능동면역은 예방접종으로 항체를 만든 것이다. 자연수동면역은 태반이나 모유를 통해 모체에게서 받은 항체이며, 인공수동면역은 면역글로불린·항독소처럼 만들어진 항체를 직접 주입받은 것이다. '능동'은 내 몸이 항체를 만드는 것이라 효과가 늦게 나타나지만 오래가고, '수동'은 항체를 받는 것이라 즉시 효과가 있으나 지속기간이 짧다는 원리로 구분하면 헷갈리지 않는다.",
  dysphagia_feeding: "삼킴곤란(연하곤란) 환자의 식사에서 가장 중요한 것은 흡인 예방이다. 가능한 한 앉은 자세(90도)를 취하고, 고개는 뒤로 젖히지 말고 약간 앞으로 숙여 기도가 좁아지도록 한다. 묽은 액체는 오히려 흡인 위험이 크므로 걸쭉하게 점도를 높인 음식이 안전하고, 한 번에 조금씩 천천히 제공하며 입안에 음식이 남았는지 확인한 후 다음 숟가락을 준다. 편마비가 있으면 건강한 쪽으로 음식을 넣고 마비된 쪽을 지지해주며, 식사 후 30분 정도는 앉은 자세를 유지해 역류를 막는다.",
  maslow_needs: "매슬로우는 인간의 욕구를 5단계로 나누고, 하위 욕구가 충족되어야 상위 욕구로 나아간다고 보았다. 간호에서는 이 순서가 곧 간호 우선순위가 된다. ① 생리적 욕구(최하위): 산소·호흡, 수분과 영양, 배설, 체온 유지, 수면, 통증 완화. 예) 산소포화도 저하, 기도폐쇄, 호흡곤란, 심한 탈수, 소변을 보지 못함, 극심한 통증. ② 안전 욕구: 신체적 위험과 위협으로부터의 보호. 예) 낙상 예방을 위해 침상난간 올리기, 미끄럼 방지 신발, 감염 예방과 격리, 투약 오류 방지, 화재·화상 예방, 신체보호대 적용. ③ 소속과 애정 욕구: 관계와 유대. 예) 가족 면회 격려, 격리 환자의 고립감 완화, 자조모임 참여, 같은 병실 환자와의 교류. ④ 자아존중 욕구: 존중받고 인정받고 싶은 마음. 예) 처치 시 사생활(프라이버시) 보호, 스스로 할 수 있는 일은 직접 하도록 격려, 이름을 불러 존중하기, 자가간호 참여. ⑤ 자아실현 욕구(최상위): 자신의 잠재력을 실현하는 것. 예) 재활 목표 세우기, 퇴원 후 학업·직업 계획, 같은 질환자를 돕는 봉사. 시험 요령: 여러 상황이 함께 제시되면 생명과 직결된 것(기도·호흡·순환)을 항상 먼저 고르고, '안전'과 '생리적'이 함께 나오면 생리적 욕구가 우선이다.",
  defense_mechanism: "방어기제는 불안을 줄이기 위해 무의식적으로 사용하는 심리적 대처 방법으로, 정의와 예시를 짝지어 외워야 한다. 억압은 괴로운 기억을 무의식으로 밀어 넣는 것, 부정은 사실 자체를 받아들이지 않는 것(암 진단을 듣고 오진이라 우김), 퇴행은 이전 발달단계의 행동으로 되돌아가는 것(동생이 태어나자 대소변을 못 가림)이다. 투사는 자신의 감정을 남의 탓으로 돌리는 것, 전치는 감정을 덜 위협적인 대상에게 옮기는 것(상사에게 혼나고 가족에게 화풀이), 반동형성은 속마음과 정반대로 행동하는 것(미운 사람에게 더 친절함)이다. 합리화는 그럴듯한 이유를 붙이는 것(신 포도), 동일화는 존경하는 사람을 닮으려는 것, 보상은 부족한 부분을 다른 능력으로 메우는 것이다. 승화는 충동적 에너지를 사회적으로 인정받는 형태로 바꾸는 것(공격성을 운동선수로 발휘)으로, 방어기제 중 가장 성숙하고 건강한 형태로 분류된다.",
  consciousness_level: "의식수준은 자극에 대한 반응 정도에 따라 다섯 단계로 구분하며, 단계가 내려갈수록 반응이 줄어든다. 명료(alert)는 시간·장소·사람을 정확히 인식하는 정상 상태이고, 기면(drowsy)은 졸음이 많아 자꾸 잠들지만 자극을 주면 깨어나 반응한다. 혼미(stupor)는 큰 소리나 통증 같은 강한 자극에만 반응하고 자극이 없으면 다시 잠들며, 반혼수(semicoma)는 통증 자극에 아주 미약한 반응만 보인다. 혼수(coma)는 어떠한 자극에도 반응이 없고 수의운동(자발적 움직임)이 전혀 없는 가장 깊은 단계이다. 의식이 저하된 환자는 기도 유지와 흡인 예방이 최우선이므로 측위나 반좌위를 취해주고, 틀니는 제거하며, 구강간호 시 물을 최소한으로 사용한다.",
  disease_causation_factors: "질병 발생의 3대 요인은 병인(원인)·숙주·환경이며, 병인은 다시 성질에 따라 분류한다. 생물학적 요인은 바이러스·세균·기생충 등 살아있는 병원체이고, 화학적 요인은 유해가스·중금속·살충제·식품첨가물 등이며, 물리적 요인은 진동·소음·방사선·온열 등이다. 영양적 요인(과다·결핍)도 하나의 병인으로 분류된다. 숙주 요인은 연령·성별·유전·영양상태·면역력처럼 개인에게 속한 특성이고, 환경 요인은 기후·주거·사회경제적 조건처럼 병인과 숙주를 둘러싼 조건이다.",
  disease_prevention_levels: "질병 예방은 1차·2차·3차 예방으로 나뉘며, 시행 시점과 목적이 다르다. 1차 예방은 질병이 발생하기 전에 막는 것으로 예방접종, 보건교육, 영양관리, 안전벨트 착용 등이 해당한다. 2차 예방은 질병을 조기에 발견해 진행을 막는 것으로 건강검진, 조기 진단, 선별검사가 대표적이다. 3차 예방은 이미 발생한 질병의 후유증과 장애를 최소화하는 것으로 재활치료, 사회복귀 훈련이 해당한다. 시험에서는 '예방접종·교육'은 1차, '검진·조기발견'은 2차, '재활·복귀'는 3차로 구분해서 암기하면 된다.",
  general_review: "이 문항은 개별 이론이 명확히 한 범주로 묶이지 않는 문항입니다. 학생들에게는 문제집의 해당 단원(기초간호학개요/보건간호학개요/기본간호실기)을 함께 짚어주시고, 정답 선택지의 핵심 키워드를 중심으로 복습시켜 주세요."

/* =========================================================

   ========================================================= */

/* ---------- 1. 비밀번호 로그인 ---------- */
const lockScreen = document.getElementById('lockScreen');
const mainScreen = document.getElementById('mainScreen');
const pwInput = document.getElementById('pwInput');
const pwBtn   = document.getElementById('pwBtn');
const pwError = document.getElementById('pwError');

function tryLogin(){
  if(pwInput.value === TEACHER_PASSWORD){
    lockScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    try { sessionStorage.setItem('teacherAuth','1'); } catch(e){}
    initAfterLogin();
  } else {
    pwError.style.display = 'block';
    pwInput.value = '';
    pwInput.focus();
  }
}
pwBtn.addEventListener('click', tryLogin);
pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
pwInput.addEventListener('input', ()=>{ pwError.style.display='none'; });

// 같은 탭 안에서는 재입력 없이 유지
let alreadyAuthed = false;
try { alreadyAuthed = sessionStorage.getItem('teacherAuth') === '1'; } catch(e){}
if(alreadyAuthed){
  lockScreen.style.display = 'none';
  mainScreen.style.display = 'block';
} else {
  setTimeout(()=>pwInput.focus(), 100);
}

/* ---------- 2. 상태 ---------- */
let ALL_RECORDS = [];        // 서버에서 받은 전체 기록
let RECORDS = [];            // 현재 선택된 반의 기록
let currentClass = CLASS_LIST[0];
let inited = false;

/* ---------- 3. 탭 ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.style.display='none');
    document.getElementById('panel-'+btn.dataset.tab).style.display='block';
  });
});

/* ---------- 4. 셀렉트 채우기 ---------- */
const classSelect       = document.getElementById('classSelect');
const pfRoundSelect     = document.getElementById('pfRoundSelect');
const twRoundSelect     = document.getElementById('twRoundSelect');
const explainRoundSelect= document.getElementById('explainRoundSelect');
const studentTrendSelect= document.getElementById('studentTrendSelect');

CLASS_LIST.forEach(c=>{
  const o=document.createElement('option'); o.value=c; o.textContent=c;
  classSelect.appendChild(o);
});
for(let r=1;r<=TOTAL_ROUNDS;r++){
  [pfRoundSelect, twRoundSelect, explainRoundSelect].forEach(sel=>{
    const o=document.createElement('option'); o.value=r; o.textContent=r+'회'; sel.appendChild(o);
  });
}
document.getElementById('pfThresholdLabel').textContent = Math.round(PASS_THRESHOLD*100)+'%';

function fillStudentTrendOptions(){
  studentTrendSelect.innerHTML = '';
  (ROSTER[currentClass]||[]).forEach(name=>{
    const o=document.createElement('option'); o.value=name; o.textContent=name;
    studentTrendSelect.appendChild(o);
  });
}

classSelect.addEventListener('change', ()=>{
  currentClass = classSelect.value;
  fillStudentTrendOptions();
  applyClassFilter();
  renderAll();
});
pfRoundSelect.addEventListener('change', renderPassFail);
twRoundSelect.addEventListener('change', renderTopWrong);
explainRoundSelect.addEventListener('change', renderExplain);
studentTrendSelect.addEventListener('change', renderSingleTrend);

/* ---------- 5. 데이터 로드 ---------- */
function initAfterLogin(){
  if(inited) return;
  inited = true;
  fillStudentTrendOptions();
  loadData();
}
if(alreadyAuthed) initAfterLogin();

function applyClassFilter(){
  // 반 정보가 없는 예전 기록은 명렬에 이름이 있으면 그 반으로 간주
  const roster = ROSTER[currentClass] || [];
  RECORDS = ALL_RECORDS.filter(r=>{
    if(r.cls) return r.cls === currentClass;
    return roster.indexOf(r.student) !== -1;
  });
  const students = new Set(RECORDS.map(r=>r.student));
  document.getElementById('classInfo').textContent =
    currentClass + ' · 명렬 ' + roster.length + '명 · 응시기록 ' + RECORDS.length + '건 (' + students.size + '명 참여)';
  document.getElementById('trendCount').textContent = roster.length;
}

function loadData(){
  if(!GAS_URL || GAS_URL.indexOf('PASTE_YOUR')===0){
    document.getElementById('loadingBox').textContent = '⚠ GAS_URL이 설정되지 않았습니다. Google Apps Script 배포 후 URL을 넣어주세요.';
    return;
  }
  fetch(GAS_URL + '?action=getAllScores')
    .then(r=>r.json())
    .then(data=>{
      ALL_RECORDS = data.records || [];
      document.getElementById('loadingBox').style.display='none';
      document.getElementById('panel-passfail').style.display='block';
      applyClassFilter();
      renderAll();
    })
    .catch(err=>{
      document.getElementById('loadingBox').textContent = '데이터 로드 실패: '+err;
    });
}

// 한 영역에서 오류가 나도 나머지 화면은 정상 표시되도록 개별 실행한다.
// (예: 차트 라이브러리 CDN이 차단된 환경에서도 명단/해설/최다오답은 보여야 함)
function safeRun(label, fn){
  try { fn(); }
  catch(err){ console.error('['+label+'] 렌더 실패:', err); }
}

function renderAll(){
  safeRun('Pass/Fail', renderPassFail);
  safeRun('전체추이',  renderAllTrend);
  safeRun('개별추이',  renderSingleTrend);
  safeRun('해설',      renderExplain);
  safeRun('최다오답',  renderTopWrong);
}

/* ---------- 6. 회차별 Pass/Fail (과락 포함) ---------- */
function renderPassFail(){
  const round = parseInt(pfRoundSelect.value);
  const records = RECORDS.filter(r=>r.round===round);
  const tbody = document.querySelector('#pfTable tbody');
  tbody.innerHTML='';
  document.getElementById('pfEmpty').style.display = records.length===0 ? 'block':'none';
  records.sort((a,b)=>b.score-a.score);
  records.forEach(r=>{
    const tr = document.createElement('tr');
    if(!r.pass) tr.className='row-fail';

    // 과락 과목: 새 기록은 failedSubjects, 예전 기록은 정보 없음
    let failCell;
    if(r.failedSubjects && r.failedSubjects.length){
      failCell = '<span style="color:var(--fail);font-weight:700;">'+r.failedSubjects.join(', ')+'</span>';
    } else if(r.subjects && r.subjects.length){
      failCell = '<span class="muted">없음</span>';
    } else {
      failCell = '<span class="muted">-</span>';
    }

    tr.innerHTML = '<td>'+r.student+'</td>'
                 + '<td>'+r.correct+'/105</td>'
                 + '<td>'+r.score+'</td>'
                 + '<td>'+failCell+'</td>'
                 + '<td><span class="tag '+(r.pass?'pass':'fail')+'">'+(r.pass?'PASS':'FAIL')+'</span></td>';
    tbody.appendChild(tr);
  });
}

/* ---------- 7. 점수 추이 ---------- */
/* =====================================================================
   자체 점수 추이 그래프 (Chart.js가 없을 때 사용)
   외부 라이브러리 없이 캔버스 기본 기능만 사용하므로
   CDN이 차단된 네트워크에서도 항상 그려진다.
   ===================================================================== */
function drawSimpleTrend(canvasEl, records){
  if(!canvasEl) return;
  const recs = records.slice().sort((a,b)=>a.round-b.round);

  // 캔버스를 가로 100%로 펼친 뒤 실제 표시 폭을 측정한다
  canvasEl.style.width = '100%';
  canvasEl.style.display = 'block';
  const cssW = canvasEl.clientWidth || canvasEl.parentElement.clientWidth || 600;
  const cssH = parseInt(canvasEl.getAttribute('height'), 10) || 140;
  const dpr  = window.devicePixelRatio || 1;
  canvasEl.width  = Math.round(cssW * dpr);
  canvasEl.height = Math.round(cssH * dpr);
  canvasEl.style.width  = cssW + 'px';
  canvasEl.style.height = cssH + 'px';

  const ctx = canvasEl.getContext('2d');
  if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const padL=34, padR=12, padT=12, padB=22;
  const w = cssW-padL-padR, h = cssH-padT-padB;
  const yFor = v => padT + h - (v/100)*h;

  // 가로 눈금선 (0/50/100점)
  ctx.strokeStyle='#e3ece8'; ctx.lineWidth=1;
  ctx.fillStyle='#8aa39a'; ctx.font='10px sans-serif'; ctx.textAlign='right';
  [0,50,100].forEach(v=>{
    const y=yFor(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();
    ctx.fillText(v+'', padL-6, y+3);
  });

  // 합격선
  const cut = Math.round(PASS_THRESHOLD*100);
  const cy = yFor(cut);
  ctx.save();
  ctx.strokeStyle='#e0334f'; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(padL,cy); ctx.lineTo(padL+w,cy); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#e0334f'; ctx.textAlign='left';
  ctx.fillText('합격선 '+cut, padL+3, cy-4);

  if(recs.length===0) return;

  const xFor = i => recs.length===1 ? padL+w/2 : padL + (i/(recs.length-1))*w;

  // 영역 채우기
  ctx.beginPath();
  ctx.moveTo(xFor(0), yFor(recs[0].score));
  recs.forEach((r,i)=>ctx.lineTo(xFor(i), yFor(r.score)));
  ctx.lineTo(xFor(recs.length-1), padT+h);
  ctx.lineTo(xFor(0), padT+h);
  ctx.closePath();
  ctx.fillStyle='rgba(20,128,95,0.15)';
  ctx.fill();

  // 선
  ctx.beginPath();
  recs.forEach((r,i)=>{ const x=xFor(i), y=yFor(r.score); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#14805f'; ctx.lineWidth=2; ctx.stroke();

  // 점 + 라벨
  ctx.textAlign='center';
  recs.forEach((r,i)=>{
    const x=xFor(i), y=yFor(r.score);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fillStyle='#14805f'; ctx.fill();
    ctx.fillStyle='#0f4c3a'; ctx.font='bold 10px sans-serif';
    ctx.fillText(r.score, x, y-8);
    ctx.fillStyle='#8aa39a'; ctx.font='10px sans-serif';
    ctx.fillText(r.round+'회', x, padT+h+14);
  });
}

let allTrendChart=null, singleTrendChart=null;

function renderAllTrend(){
  const ctx = document.getElementById('allTrendChart');
  if(typeof Chart === 'undefined'){
    // 여러 명을 겹쳐 그리는 그래프는 라이브러리가 필요하므로 안내만 표시
    const note = document.getElementById('allTrendNote');
    if(note){
      note.style.display='block';
      note.textContent = '⚠ 그래프 라이브러리를 불러오지 못해 반 전체 그래프는 표시할 수 없습니다. (아래 개별 학생 추이는 정상 표시됩니다)';
    }
    return;
  }
  const roster = ROSTER[currentClass] || [];
  const datasets = roster.map((name,i)=>{
    const recs = RECORDS.filter(r=>r.student===name).sort((a,b)=>a.round-b.round);
    const hue = Math.round(i*(360/Math.max(1,roster.length)));
    return {
      label:name,
      data: recs.map(r=>({x:r.round, y:r.score})),
      borderColor:'hsl('+hue+',55%,45%)',
      backgroundColor:'transparent',
      tension:0.2,
      pointRadius:2
    };
  });
  if(allTrendChart) allTrendChart.destroy();
  allTrendChart = new Chart(ctx,{
    type:'line',
    data:{datasets},
    options:{
      parsing:false,
      scales:{
        x:{type:'linear', min:1, max:TOTAL_ROUNDS, title:{display:true,text:'회차'}},
        y:{min:0,max:100,title:{display:true,text:'점수'}}
      },
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}
    }
  });
}

function renderSingleTrend(){
  const name = studentTrendSelect.value;
  const recs = RECORDS.filter(r=>r.student===name).sort((a,b)=>a.round-b.round);
  const ctx = document.getElementById('singleTrendChart');
  if(typeof Chart === 'undefined'){ drawSimpleTrend(ctx, recs); return; }
  const cutLine = Math.round(PASS_THRESHOLD*100);
  if(singleTrendChart) singleTrendChart.destroy();
  singleTrendChart = new Chart(ctx,{
    type:'line',
    data:{
      labels: recs.map(r=>r.round+'회'),
      datasets:[
        {label:name+' 점수', data:recs.map(r=>r.score), borderColor:'#16a878', backgroundColor:'rgba(22,168,120,.15)', fill:true, tension:.25, pointRadius:4},
        {label:'합격선('+cutLine+'점)', data:recs.map(()=>cutLine), borderColor:'#d64550', borderDash:[6,4], pointRadius:0}
      ]
    },
    options:{ scales:{y:{min:0,max:100}}, plugins:{legend:{position:'bottom'}} }
  });
}

/* 해설 문항번호가 원본 문제집과 대조 검증된 회차 */
const VERIFIED_EXPLANATION_ROUNDS = [1, 2];
function verifyWarnHTML(round){
  if(VERIFIED_EXPLANATION_ROUNDS.indexOf(round) !== -1) return '';
  return '<div style="padding:12px 14px;background:#fdf6de;border-left:6px solid #d79a1e;'
       + 'border-radius:10px;margin-bottom:14px;font-size:13.5px;line-height:1.65;">'
       + '<b>⚠ 이 회차 해설은 문항 번호 검증 중입니다.</b><br>'
       + '원본 문제집과 대조한 결과 일부 구간에서 해설이 실제 문항 번호와 어긋난 것이 확인되었습니다. '
       + '정답 번호는 정답지 기준으로 정확하지만, <b>해설 내용은 수업에 사용하기 전 문제집과 대조해 주세요.</b>'
       + '</div>';
}

/* ---------- 8. 회차별 해설 ---------- */
function renderExplain(){
  const round = parseInt(explainRoundSelect.value);
  const box = document.getElementById('explainList');
  const data = EXPLANATIONS[round];
  if(!data){
    box.innerHTML = '<p class="muted">이 회차의 문제집 PDF가 아직 업로드되지 않아 해설이 준비되지 않았습니다.</p>';
    return;
  }
  let html = verifyWarnHTML(round);
  html += '<h3 style="margin:0 0 10px;">'+round+'회 전체 문항 해설 (정답 풀이 + 오답 이유)</h3>';
  html += '<table><thead><tr><th style="width:70px;">번호</th><th style="width:60px;">정답</th><th style="text-align:left;">해설</th></tr></thead><tbody>';
  for(let q=1;q<=QUESTIONS_PER_ROUND;q++){
    const ans = ANSWER_KEY[round][q-1];
    const circled = ['①','②','③','④','⑤'][ans-1];
    html += '<tr><td>'+q+'</td><td>'+circled+'</td><td style="text-align:left;">'+(data[q]||'-')+'</td></tr>';
  }
  html += '</tbody></table>';
  box.innerHTML = html;
}

/* ---------- 9. 반별 · 회차별 최다오답 TOP20 ---------- */
function renderTopWrong(){
  const round = parseInt(twRoundSelect.value);
  const records = RECORDS.filter(r=>r.round===round);
  const box = document.getElementById('topWrongList');

  if(records.length===0){
    box.innerHTML = '<p class="muted">'+currentClass+' '+round+'회는 아직 응시 기록이 없습니다.</p>';
    return;
  }

  const counts = {};
  records.forEach(r=>{
    (r.wrongQuestions||[]).forEach(q=>{ counts[q] = (counts[q]||0)+1; });
  });

  const arr = Object.keys(counts).map(q=>({ q: Number(q), cnt: counts[q] }));
  // 오답 인원 많은 순 → 같으면 문항 번호 순
  arr.sort((a,b)=> b.cnt-a.cnt || a.q-b.q );
  const top20 = arr.slice(0,20);

  if(top20.length===0){
    box.innerHTML = '<p class="muted">🎉 이 회차는 오답 문항이 없습니다.</p>';
    return;
  }

  const taken = records.length;
  let html = verifyWarnHTML(round);
  html += '<h3 style="margin:0 0 12px;">'+currentClass+' · '+round+'회 최다오답 TOP '+top20.length
           + ' <span class="muted" style="font-weight:400;font-size:13px;">(응시 '+taken+'명 기준)</span></h3>';

  top20.forEach((item,i)=>{
    const ans = ANSWER_KEY[round][item.q-1];
    const circled = ['①','②','③','④','⑤'][ans-1];
    const exp = (EXPLANATIONS[round] && EXPLANATIONS[round][item.q]) || '(정답 해설 준비중)';
    const topicKey = (QUESTION_TOPIC[round] && QUESTION_TOPIC[round][item.q]) || 'general_review';
    const topicNote = TOPIC_NOTES[topicKey] || TOPIC_NOTES.general_review;
    const rate = Math.round(item.cnt/taken*100);

    html += '<div class="card" style="margin-bottom:14px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">'
      +   '<div style="font-weight:800;color:var(--accent-dark);">'+(i+1)+'위 · '+item.q+'번 '
      +   '<span style="font-weight:400;color:var(--sub);font-size:12.5px;">(정답 '+circled+')</span></div>'
      +   '<span class="tag fail">오답 '+item.cnt+'명 / '+taken+'명 · '+rate+'%</span>'
      + '</div>'
      + '<div style="margin-top:10px;font-size:13.5px;"><b>✅ 정답 풀이</b><br>'+exp+'</div>'
      + '<div style="margin-top:10px;padding:12px;background:var(--mint-box);border-radius:10px;font-size:13.5px;line-height:1.7;">'
      +   '<b>📚 심화 해설 (수업용 총정리)</b><br>'+topicNote
      + '</div>'
      + '</div>';
  });
  box.innerHTML = html;
}
</script>
</body>
</html>
